<script>

const $ = (s, el = document) => el.querySelector(s);
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const brl = (n) => Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const pct = (n) => Math.round((Number(n) || 0) * 100) + '%';

const fromLocalInput = (v) => v ? new Date(v + ':00-03:00').toISOString() : null; // Brasília = UTC-3 (sem horário de verão)

let toastTimer;
function toast(msg) {
  // "popover" faz o aviso aparecer por cima até das janelas abertas (card, perguntas)
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  try { t.showPopover?.(); } catch { /* já está aberto */ }
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; try { t.hidePopover?.(); } catch { /* ok */ } }, 4000);
}
async function run(promise, falha = 'Algo deu errado. Tente de novo.') {

}

function closeDialog() { if (dlg.open) dlg.close(); }
const MOTIVOS_PERDA = ['Lead desqualificado', 'Não respondeu', 'Achou caro', 'Não é o momento'];
function ask(titulo, campos) {
  return new Promise((resolve) => {
    const inputs = campos.map((c) => {
      const el = c.type === 'textarea' ? h('textarea', { name: c.name })
        : c.type === 'select' ? h('select', { name: c.name }, h('option', { value: '' }, 'Escolha uma opção...'), ...c.options.map((o) => h('option', { value: o }, o)))
        : h('input', { name: c.name, type: c.type || 'text', step: c.step, min: c.min });
      if (c.value != null) el.value = c.value;
      return h('label', {}, c.label, el);
    });
    let feito = false;
    const fim = (v) => { if (!feito) { feito = true; closeDialog(); resolve(v); } };
    dlg.onclose = () => { if (!dlg.open) fim(null); }; // ignora o fechamento do card anterior
    openDialog(h('h2', {}, titulo), ...inputs, h('div', { class: 'actions' },

        const vals = Object.fromEntries(inputs.map((l) => [l.lastChild.name, l.lastChild.value]));
        const falta = campos.find((c) => c.required && !String(vals[c.name]).trim());
        if (falta) { toast('Escolha: ' + falta.label.toLowerCase() + '.'); return; } // a janela continua aberta
        fim(vals);
      } }, 'Confirmar'),
      h('button', { class: 'btn ghost', onclick: () => fim(null) }, 'Cancelar')));
    inputs[0]?.lastChild.focus();
  });
}

// ---------- comemoração (reunião agendada) ----------
const FRASES = ['Reunião marcada! 🎉', 'Mais um passo rumo à venda!', 'Agenda cheia é negócio andando.', 'Reunião agendada. Bora fechar!', 'Pequena vitória, grande caminho.', 'Boa! Mais uma conversa na mesa.'];
// "popover" coloca o elemento por cima até da janela aberta do card
function noTopo(el) { document.body.append(el); try { el.showPopover?.(); } catch { /* navegador antigo: fica na página mesmo */ } }
function celebrar() {
  const aviso = h('div', { class: 'comemora', role: 'status', popover: 'manual' }, FRASES[Math.floor(Math.random() * FRASES.length)]);
  noTopo(aviso); setTimeout(() => aviso.remove(), 3600);
  const cv = h('canvas', { class: 'confete', 'aria-hidden': 'true', popover: 'manual' });
  cv.width = innerWidth; cv.height = innerHeight; noTopo(cv);
  const ctx = cv.getContext('2d'), cores = ['#2f5bea', '#16a34a', '#d97706', '#dc2626', '#a855f7', '#facc15'];
  const ps = Array.from({ length: 150 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .4, vx: (Math.random() - .5) * 4,
    vy: 2 + Math.random() * 4, r: 5 + Math.random() * 6, a: Math.random() * 6.28, va: (Math.random() - .5) * .3, c: cores[Math.floor(Math.random() * cores.length)] }));
  const fim = performance.now() + 2800;
  (function quadro(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.vy += .05; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ctx.restore(); }
    if (t < fim) requestAnimationFrame(quadro); else cv.remove();
  })(performance.now());
}

// ---------- login ----------
function telaLogin(msg = '') {
  const email = h('input', { type: 'email', autocomplete: 'username', required: true });
  const senha = h('input', { type: 'password', autocomplete: 'current-password', required: true });
  const erro = h('div', { class: 'err' }, msg);
  const btn = h('button', { class: 'btn', type: 'submit' }, 'Entrar');
  const form = h('form', { class: 'login' }, h('h1', { style: 'margin:0;font-size:20px' }, 'Meu CRM'),
    h('label', {}, 'E-mail', email), h('label', {}, 'Senha', senha), erro, btn);
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); btn.disabled = true; erro.textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: senha.value });
    btn.disabled = false;
    if (error) { erro.textContent = 'E-mail ou senha incorretos.'; senha.value = ''; }
    // se deu certo, onAuthStateChange abre o painel
  });
  app.replaceChildren(form); email.focus();
}

// ---------- dados ----------
async function carregar() {
  const leads = []; // o Supabase devolve no máximo 1000 linhas por vez: busca em páginas
  for (let ini = 0; ; ini += 1000) {
    const lote = await run(sb.from('leads').select('*').order('atualizado_em', { ascending: false }).range(ini, ini + 999));
    leads.push(...lote); if (lote.length < 1000) break;
  }
  S.leads = leads;
  const fus = await run(sb.from('followups').select('id,lead_id,numero,data_prevista').eq('status', 'pendente').order('data_prevista'));
  S.proximo = {}; S.fups = fus;
  for (const f of fus) if (!S.proximo[f.lead_id]) S.proximo[f.lead_id] = f; // o mais próximo de cada lead
  const cfg = await run(sb.from('configuracoes').select('chave,valor'));
  S.cfg = Object.fromEntries(cfg.map((c) => [c.chave, c.valor]));
  S.ativ = await run(sb.from("atividades").select("*").is("feito_em", null).order("vence_em"));
  S.atrasados = fus.filter((f) => f.data_prevista <= hoje()).length + S.ativ.filter((x) => x.vence_em <= hoje()).length;
  const et = await run(sb.from('etiquetas').select('lead_id,texto').order('criado_em'));
  S.etiq = {}; for (const e of et) (S.etiq[e.lead_id] ||= []).push(e.texto);
}
const leadsFiltrados = () => {
  const q = semAcento(S.q).trim(), qd = q.replace(/\D/g, '');
  return S.leads.filter((l) => (!S.temp || l.temperatura === S.temp) &&
    (!q || semAcento(l.nome).includes(q) || semAcento(l.email).includes(q) || (qd && l.telefone.includes(qd))));
};

// ---------- estrutura principal ----------
async function abrirApp() {
  const { data: ok, error } = await sb.rpc('usuario_autorizado');
  if (error || !ok) { await sb.auth.signOut(); return telaLogin('Este e-mail não tem permissão para usar o CRM.'); }
  const busca = h('input', { class: 'search', type: 'search', placeholder: 'Buscar nome, e-mail ou telefone', 'aria-label': 'Buscar',
    oninput: (e) => { S.q = e.target.value; if (['funil', 'hoje'].includes(S.view)) desenhar(); } });
  const filtro = h('select', { class: 'filtro', 'aria-label': 'Filtrar por temperatura', onchange: (e) => { S.temp = e.target.value; if (['funil', 'hoje'].includes(S.view)) desenhar(); } },
    h('option', { value: '' }, 'Todas as temperaturas'), h('option', { value: 'quente' }, '🔥 Só quentes'), h('option', { value: 'morno' }, 'Só mornos'));
  const situacao = h('select', { class: 'filtro', 'aria-label': 'Filtrar negociações', onchange: (e) => {
    S.sit = e.target.value; try { localStorage.setItem('crm_sit', S.sit); } catch { /* ok */ }
    S.view = 'funil'; desenhar(); } },
    ...SITUACOES.map(([k, n]) => h('option', { value: k, selected: k === S.sit }, 'Negociações: ' + n)));
  const nav = h('nav', {}, ...[['funil', 'Funil'], ['hoje', 'Hoje'], ['painel', 'Painel'], ['metas', 'Metas'], ['config', 'Config']].map(([id, nome]) =>
    h('button', { 'data-v': id, onclick: () => { S.view = id; desenhar(); } }, nome, id === 'hoje' ? h('span', { class: 'badge', id: 'badge' }) : null)));
  app.replaceChildren(
    h('header', {}, h('h1', {}, 'Meu CRM'), nav, busca, situacao, filtro, h('div', { class: 'spacer' }),
      h('button', { class: 'btn', onclick: novoLead }, '+ Novo lead'),
      h('button', { class: 'btn ghost', onclick: () => sb.auth.signOut() }, 'Sair')),
    h('main', { id: 'view' }));
  await aplicarRegraFollowup(); await carregar(); desenhar();
  // ao voltar para a aba depois de um tempo (ex.: virou o dia), roda a regra de novo
  document.addEventListener('visibilitychange', () => { if (!document.hidden && $('#view')) aplicarRegraFollowup().then(recarregar); });
}
async function desenhar() {
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.v === S.view));
  const b = $('#badge'); if (b) { b.textContent = S.atrasados; b.hidden = !S.atrasados; }
  const v = $('#view'); if (!v) return;
  try {
    if (S.view === 'funil') v.replaceChildren(quadro());
    else if (S.view === 'hoje') v.replaceChildren(...telaHoje());
    else if (S.view === 'painel') v.replaceChildren(...await telaPainel());
    else if (S.view === 'metas') v.replaceChildren(...await telaMetas());
    else v.replaceChildren(...telaConfig());
  } catch (e) { console.error(e); }
}
async function recarregar() { await carregar(); desenhar(); }
// Regra: no dia do primeiro follow-up, o card sai de "Proposta enviada" e vai para "Follow-up".
// O banco também roda isso sozinho todo dia; aqui é a garantia de que está em dia ao abrir o CRM.
async function aplicarRegraFollowup() {
  try { await sb.rpc('mover_followups_vencidos'); } catch (e) { console.warn('regra de follow-up indisponível', e); }
}

// ---------- funil ----------
// Situação da negociação: em andamento, ganha ou perdida. O card NÃO muda de coluna: só muda de cor.
function passaSituacao(l) {
  return S.sit === 'todas' || (S.sit === 'andamento' && l.situacao === 'andamento')
    || (S.sit === 'ganhas' && l.situacao === 'ganha') || (S.sit === 'perdidas' && l.situacao === 'perdida');
}
function quadro() {
  const lista = leadsFiltrados().filter(passaSituacao), t = hoje();
  const board = h('div', { class: 'board', style: `--cols:${ETAPAS.length}` }, ...ETAPAS.map(([id, nome]) => {
    const itens = lista.filter((l) => l.etapa === id);
    const col = h('div', { class: 'col', 'data-etapa': id, style: `--c:${COR[id][0]};--c-bg:${COR[id][1]}` },
      h('h3', {}, h('span', {}, COR[id][2] + ' ' + nome), h('span', { class: 'contagem' }, itens.length)),
      h('div', { class: 'cards' }, itens.length ? itens.map((l) => cartao(l, t)) : h('div', { class: 'empty' }, '—')));
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', (e) => {
      e.preventDefault(); col.classList.remove('over');
      const lead = S.leads.find((l) => l.id === e.dataTransfer.getData('text/plain'));
      if (lead && lead.etapa !== id) mover(lead, id);
    });
    return col;
  }));
  if (S.sit !== 'ganhas' && S.sit !== 'perdidas') return board;
  const ganhas = S.sit === 'ganhas', n = lista.length, total = lista.reduce((s, l) => s + Number(l.valor_venda || 0), 0);
  return h('div', {}, h('div', { class: 'panel resumo ' + (ganhas ? 'ganha' : 'perdida') },
    ganhas ? `🏆 ${n} ${n === 1 ? 'negociação ganha' : 'negociações ganhas'} • ${brl(total)}`
      : `💔 ${n} ${n === 1 ? 'negociação perdida' : 'negociações perdidas'}`), board);
}
function cartao(l, t) {
  const fu = S.proximo[l.id];
  let tag = null;
  if (l.situacao === 'ganha') tag = h('span', { class: 'tag won' }, '🏆 ' + brl(l.valor_venda));
  else if (l.situacao === 'perdida') tag = h('span', { class: 'tag lost' }, '💔 ' + (l.motivo_perda || 'Perdida'));
  else if (fu) tag = h('span', { class: 'tag ' + (fu.data_prevista < t ? 'late' : fu.data_prevista === t ? 'today' : '') }, `Follow-up ${fu.numero} • ${fmtDay(fu.data_prevista).slice(0, 5)}`);
  else if (l.etapa === 'agendada' && l.reuniao_em) tag = h('span', { class: 'tag' }, fmtDT(l.reuniao_em));
  const temp = TEMP[l.temperatura], rep = (S.etiq[l.id] || []).length;
  const acoesFu = (l.etapa === 'followup' && fu && l.situacao === 'andamento') ? cartaoAcoesFollowup(l, fu) : null;
  const el = h('div', { class: 'lead' + (l.situacao === 'ganha' ? ' ganha' : l.situacao === 'perdida' ? ' perdida' : ''), draggable: 'true', onclick: () => abrirLead(l.id) },
    h('div', { class: 'topo' }, h('span', { class: 'avatar', 'aria-hidden': 'true' }, (l.nome.trim()[0] || '?').toUpperCase()),
      h('div', { style: 'min-width:0' }, h('b', {}, l.nome), h('small', {}, l.telefone ? '+' + l.telefone : l.email))),
    (temp || rep || tag) ? h('div', { class: 'chips', style: 'margin-top:4px' },
      temp ? h('span', { class: 'tag ' + temp[1] }, temp[0]) : null,
      rep ? h('span', { class: 'tag rep', title: S.etiq[l.id].join('\n') }, `↻ Preencheu de novo${rep > 1 ? ' ×' + rep : ''}`) : null,
      tag) : null,
    acoesFu);
  el.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', l.id));
  return el;
}
// Na etapa Follow-up: WhatsApp com a mensagem pronta e "Feito" direto no card
function cartaoAcoesFollowup(l, fu) {
  const msgs = S.cfg.mensagens || [], parar = (e) => e.stopPropagation(); // os botões não abrem o card
  const texto = (msgs[fu.numero - 1] || '').replaceAll('{nome}', l.nome.split(' ')[0]);
  const [a, b, c] = fu.data_prevista.split('-').map(Number), [x, y, z] = hoje().split('-').map(Number);
  const dias = Math.round((Date.UTC(x, y - 1, z) - Date.UTC(a, b - 1, c)) / 864e5);
  return h('div', { style: 'margin-top:6px' },
    dias > 0 ? h('small', { style: 'color:var(--bad)' }, `Atrasado ${dias} ${dias === 1 ? 'dia' : 'dias'}`) : null,
    h('div', { class: 'actions', style: 'margin-top:4px' },
      l.telefone ? h('a', { class: 'btn sm', href: waLink(l.telefone, texto), target: '_blank', rel: 'noopener noreferrer', onclick: parar }, 'WhatsApp') : null,
      h('button', { class: 'btn sm ok', type: 'button', onclick: async (e) => {
        parar(e); await run(sb.from('followups').update({ status: 'feito' }).eq('id', fu.id)); await recarregar();
      } }, 'Feito')));
}
async function mover(lead, etapa) {
  const upd = { etapa };
  if (etapa === 'agendada') {
    const r = await ask('Reunião agendada', [{ name: 'd', label: 'Data e hora (opcional)', type: 'datetime-local', value: toLocalInput(lead.reuniao_em) }]);
    if (!r) return; if (r.d) upd.reuniao_em = fromLocalInput(r.d);
  }
  await run(sb.from('leads').update(upd).eq('id', lead.id), 'Não foi possível mover o lead.');
  if (etapa === 'agendada') celebrar();
  await recarregar();
}
// Ganho / Perdido: o card continua na MESMA coluna, só muda de cor (verde ou vermelho)
async function encerrar(lead, situacao) {
  const upd = { situacao };
  if (situacao === 'ganha') {
    const r = await ask('Valor da venda', [{ name: 'v', label: 'Valor (R$)', type: 'number', step: '0.01', min: '0', value: lead.valor_venda || '' }]);
    if (!r) return; upd.valor_venda = Number(r.v) || 0;
  } else if (situacao === 'perdida') {
    const r = await ask('Por que a negociação foi perdida?', [{ name: 'm', label: 'Motivo da perda', type: 'select', required: true,
      options: MOTIVOS_PERDA, value: MOTIVOS_PERDA.includes(lead.motivo_perda) ? lead.motivo_perda : '' }]);
    if (!r) return; upd.motivo_perda = r.m;
  }
  await run(sb.from('leads').update(upd).eq('id', lead.id), 'Não foi possível atualizar a negociação.');
  const onde = ROTULO[lead.etapa];
  if (situacao === 'andamento') toast('Negociação reaberta.');
  else if (S.sit === 'andamento') toast((situacao === 'ganha' ? 'Negociação ganha! ' : 'Negociação perdida. ') + 'O card continua em "' + onde + '", agora em '
    + (situacao === 'ganha' ? 'verde' : 'vermelho') + '. Para vê-lo, use o filtro "Negociações: ' + (situacao === 'ganha' ? 'Ganhas' : 'Perdidas') + '" ou "Todas".');
  else toast(situacao === 'ganha' ? 'Negociação ganha! 🏆' : 'Negociação marcada como perdida.');
  await recarregar();
}

// ---------- novo lead ----------
async function novoLead() {
  const r = await ask('Novo lead', [
    { name: 'nome', label: 'Nome' }, { name: 'telefone', label: 'Telefone / WhatsApp' }, { name: 'email', label: 'E-mail', type: 'email' }]);
  if (!r) return;
  if (!r.nome.trim()) return toast('O nome é obrigatório.');
  await run(sb.from('leads').insert({ nome: r.nome.trim().slice(0, 200), telefone: r.telefone.slice(0, 20), email: r.email.trim().slice(0, 254), origem: 'manual' }), 'Não foi possível criar o lead.');
  await recarregar();
}

// ---------- card aberto ----------
async function abrirLead(id) {
  const [lead] = await run(sb.from('leads').select('*').eq('id', id));
  if (!lead) return;
  const [hist, notas, fus, etiq, envios, ativ] = await Promise.all([
    run(sb.from('historico_etapas').select('*').eq('lead_id', id).order('entrou_em')),
    run(sb.from('anotacoes').select('*').eq('lead_id', id).order('criado_em', { ascending: false })),
    run(sb.from('followups').select('*').eq('lead_id', id).order('numero')),
    run(sb.from('etiquetas').select('*').eq('lead_id', id).order('criado_em')),
    run(sb.from('respostas_formulario').select('*').eq('lead_id', id).order('enviado_em')),
    run(sb.from('atividades').select('*').eq('lead_id', id).order('vence_em')),
  ]);
  const campo = (rot, el) => h('label', {}, rot, el);
  const secao = (titulo, ...filhos) => h('section', { class: 'sec' }, h('h3', {}, titulo), ...filhos);

  // --- campos da esquerda
  const nome = h('input', { value: lead.nome, maxlength: 200 });
  const tel = h('input', { value: lead.telefone, inputmode: 'tel', maxlength: 20 });
  const mail = h('input', { value: lead.email, type: 'email', maxlength: 254 });
  const valor = h('input', { type: 'number', step: '0.01', min: '0', value: lead.valor_venda || '' });
  const obs = h('textarea', { maxlength: 5000 }, lead.observacao || '');
  const estagio = h('select', {}, ...ETAPAS.map(([e, n]) => h('option', { value: e, selected: e === lead.etapa }, n)));
  const nota = h('textarea', { placeholder: 'Registre o que conversaram...', maxlength: 5000 });

  // Salva o que está digitado antes de qualquer ação que recarrega o card (nada se perde)
  const guardar = () => run(sb.from('leads').update({
    nome: nome.value.trim().slice(0, 200) || 'Sem nome', telefone: tel.value.slice(0, 20), email: mail.value.trim().slice(0, 254),
    valor_venda: Number(valor.value) || 0, observacao: obs.value.slice(0, 5000),
  }).eq('id', id), 'Não foi possível salvar.');
  const acao = (fn) => async () => { await guardar(); await fn(); abrirLead(id); };

  // --- tags
  const novaTag = h('input', { placeholder: 'Nova tag', maxlength: 40, style: 'display:none;width:150px' });
  const btnTag = h('button', { class: 'btn sm ghost', type: 'button', onclick: () => { btnTag.style.display = 'none'; novaTag.style.display = ''; novaTag.focus(); } }, '+ tag');
  novaTag.addEventListener('keydown', async (e) => {
    if (e.key === 'Escape') { e.stopPropagation(); novaTag.value = ''; novaTag.style.display = 'none'; btnTag.style.display = ''; }
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const t = novaTag.value.trim(); if (!t) return;
    await acao(() => run(sb.from('etiquetas').insert({ lead_id: id, texto: t.slice(0, 120) })))();
  });
  const chips = h('div', { class: 'chips' },
    TEMP[lead.temperatura] ? h('span', { class: 'tag ' + TEMP[lead.temperatura][1] }, TEMP[lead.temperatura][0]) : null,
    etiq.map((e) => h('span', { class: 'tag rep' }, e.texto, ' ',
      h('button', { class: 'x', type: 'button', title: 'Remover tag', onclick: acao(() => run(sb.from('etiquetas').delete().eq('id', e.id))) }, '×'))),
    novaTag, btnTag);

  // --- atividades
  const msgs = S.cfg.mensagens || [];
  const linhasAtiv = [];
  for (const f of fus.filter((x) => x.status === 'pendente')) {
    const texto = (msgs[f.numero - 1] || '').replaceAll('{nome}', lead.nome.split(' ')[0]);
    linhasAtiv.push(h('div', { class: 'fu' }, h('div', { class: 'grow' }, h('b', {}, `Follow-up ${f.numero}/4 por WhatsApp`), ' ', h('small', {}, 'para ' + fmtDay(f.data_prevista))),
      lead.telefone ? h('a', { class: 'btn sm', href: waLink(lead.telefone, texto), target: '_blank', rel: 'noopener noreferrer' }, 'WhatsApp') : null,
      h('button', { class: 'btn sm ok', type: 'button', onclick: acao(() => run(sb.from('followups').update({ status: 'feito' }).eq('id', f.id))) }, 'Feito')));
  }
  for (const a of ativ.filter((x) => !x.feito_em)) {
    linhasAtiv.push(h('div', { class: 'fu' }, h('div', { class: 'grow' }, h('span', { class: 'tag' }, TIPO_ATIV[a.tipo]), ' ', a.descricao, ' ',
      h('small', {}, fmtDay(a.vence_em) + (a.hora ? ' ' + a.hora.slice(0, 5) : ''))),
      h('button', { class: 'btn sm ok', type: 'button', onclick: acao(() => run(sb.from('atividades').update({ feito_em: new Date().toISOString() }).eq('id', a.id))) }, 'Feito'),
      h('button', { class: 'btn sm ghost', type: 'button', title: 'Excluir atividade', onclick: acao(() => run(sb.from('atividades').delete().eq('id', a.id))) }, '×')));
  }
  for (const a of ativ.filter((x) => x.feito_em)) {
    linhasAtiv.push(h('div', { class: 'fu feita' }, h('div', { class: 'grow' }, '✓ ', a.descricao, ' ', h('small', {}, 'feita em ' + fmtDT(a.feito_em)))));
  }
  const oQue = h('input', { placeholder: 'Ex.: fazer follow up da proposta', maxlength: 300 });
  const tipoAtiv = h('select', {}, ...Object.entries(TIPO_ATIV).map(([k, v]) => h('option', { value: k }, v)));
  const dataAtiv = h('input', { type: 'date', value: hoje() });
  const horaAtiv = h('input', { type: 'time' });
  const rapido = [['hoje', 0], ['amanhã', 1], ['em 3 dias', 3], ['em 1 semana', 7]].map(([rot, n]) =>
    h('button', { class: 'btn sm ghost', type: 'button', onclick: () => { dataAtiv.value = somaDias(hoje(), n); } }, rot));
  const criarAtiv = acao(async () => {
    if (!oQue.value.trim()) { toast('Escreva o que precisa ser feito.'); throw new Error('vazio'); }
    if (!dataAtiv.value) { toast('Escolha a data.'); throw new Error('vazio'); }
    await run(sb.from('atividades').insert({ lead_id: id, descricao: oQue.value.trim().slice(0, 300), tipo: tipoAtiv.value, vence_em: dataAtiv.value, hora: horaAtiv.value || null }), 'Não foi possível criar a atividade.');
  });

  // --- reunião
  const reun = (lead.reuniao_em ? toLocalInput(lead.reuniao_em) : '').split('T');
  const dataReun = h('input', { type: 'date', value: reun[0] || hoje() });
  const horaReun = h('input', { type: 'time', value: reun[1] || '' });
  const agendar = acao(async () => {
    if (!dataReun.value) { toast('Escolha a data da reunião.'); throw new Error('vazio'); }
    const upd = { reuniao_em: fromLocalInput(dataReun.value + 'T' + (horaReun.value || '09:00')) };
    if (['novo', 'contato', 'conversa'].includes(lead.etapa)) upd.etapa = 'agendada';
    await run(sb.from('leads').update(upd).eq('id', id), 'Não foi possível agendar.');
    celebrar();
  });

  // --- respostas do formulário
  const perfil = envios.length
    ? envios.map((env, i) => h('div', { style: 'margin-top:6px' },
        h('small', { style: 'color:var(--muted)' }, `${i === 0 ? 'Primeiro envio' : 'Preencheu de novo'} • ${fmtDT(env.enviado_em)}`),
        (env.respostas || []).map((qa) => h('div', { class: 'qa' }, h('small', {}, qa.pergunta), h('div', {}, qa.resposta)))))
    : h('div', { class: 'empty' }, 'Sem respostas guardadas (lead criado à mão ou antes desse recurso).');

  const encerrarCard = async (situacao) => { await guardar(); closeDialog(); await encerrar({ ...lead, nome: nome.value, valor_venda: Number(valor.value) || 0 }, situacao); };

  dlg.onclose = () => { if (!dlg.open) recarregar(); };
  openDialog(
    h('div', { class: 'cardhead' },
      h('h2', {}, lead.nome, ' ', h('span', { class: 'tag' }, ROTULO[lead.etapa]), ' ',
        lead.situacao !== 'andamento' ? h('span', { class: 'tag ' + (lead.situacao === 'ganha' ? 'won' : 'lost') }, lead.situacao === 'ganha' ? '🏆 Negociação ganha' : '💔 Negociação perdida') : null),
      h('div', { class: 'actions' },
        lead.situacao === 'andamento' ? [
          h('button', { class: 'btn ok', type: 'button', onclick: () => encerrarCard('ganha') }, 'Ganho'),
          h('button', { class: 'btn bad', type: 'button', onclick: () => encerrarCard('perdida') }, 'Perdido'),
        ] : h('button', { class: 'btn', type: 'button', onclick: () => encerrarCard('andamento') }, 'Reabrir negociação'))),
    h('div', { class: 'cardcols' },
      h('div', { class: 'col2' },
        h('div', { class: 'grid2' }, campo('Valor da venda (R$)', valor), campo('Estágio', estagio)),
        h('small', { style: 'color:var(--muted);margin-top:-8px' }, 'O valor só entra no faturamento quando você clica em Ganho.'),

          campo('E-mail', mail),

          campo('Observação', obs)),

          perfil),
        secao('Atividades',

      } }, 'Salvar')));
  dlg.classList.add('largo');
  dlg.classList.toggle('ganha', lead.situacao === 'ganha');
  dlg.classList.toggle('perdida', lead.situacao === 'perdida');
}

// ---------- hoje ----------
function telaHoje() {
  const t = hoje(), msgs = S.cfg.mensagens || [], porId = Object.fromEntries(S.leads.map((l) => [l.id, l]));
  const q = semAcento(S.q).trim();
  const itens = [
    ...(S.fups || []).map((f) => ({ tipo: 'fu', data: f.data_prevista, hora: '', f, l: porId[f.lead_id] })),
    ...(S.ativ || []).map((a) => ({ tipo: 'at', data: a.vence_em, hora: a.hora || '', a, l: porId[a.lead_id] })),
  ].filter((x) => x.l && x.l.situacao === 'andamento' && (!S.temp || x.l.temperatura === S.temp) && (!q || semAcento(x.l.nome).includes(q)))
    .sort((x, y) => (x.data + x.hora).localeCompare(y.data + y.hora));
  const linha = (x) => {
    const l = x.l, atrasado = x.data < t;
    const quando = h('span', { class: 'tag ' + (atrasado ? 'late' : x.data === t ? 'today' : '') }, (atrasado ? 'atrasado • ' : '') + fmtDay(x.data) + (x.hora ? ' ' + x.hora.slice(0, 5) : ''));
    const abrir = h('button', { class: 'btn sm ghost', onclick: () => abrirLead(l.id) }, 'Abrir lead');
    if (x.tipo === 'fu') {
      const texto = (msgs[x.f.numero - 1] || '').replaceAll('{nome}', l.nome.split(' ')[0]);
      return h('div', { class: 'fu' }, h('div', { class: 'grow' }, h('b', {}, l.nome), ' ', h('span', { class: 'tag' }, `Follow-up ${x.f.numero}/4`), ' ', quando),
        l.telefone ? h('a', { class: 'btn sm', href: waLink(l.telefone, texto), target: '_blank', rel: 'noopener noreferrer' }, 'Abrir WhatsApp') : h('small', {}, 'sem telefone'),
        h('button', { class: 'btn sm ok', onclick: async () => { await run(sb.from('followups').update({ status: 'feito' }).eq('id', x.f.id)); await recarregar(); } }, 'Feito'), abrir);
    }
    return h('div', { class: 'fu' }, h('div', { class: 'grow' }, h('b', {}, l.nome), ' ', h('span', { class: 'tag' }, TIPO_ATIV[x.a.tipo]), ' ', x.a.descricao, ' ', quando),
      l.telefone ? h('a', { class: 'btn sm', href: waLink(l.telefone), target: '_blank', rel: 'noopener noreferrer' }, 'WhatsApp') : null,
      h('button', { class: 'btn sm ok', onclick: async () => { await run(sb.from('atividades').update({ feito_em: new Date().toISOString() }).eq('id', x.a.id)); await recarregar(); } }, 'Feito'), abrir);
  };
  const devidos = itens.filter((x) => x.data <= t), futuros = itens.filter((x) => x.data > t && x.data <= somaDias(t, 7));
  const novos = leadsFiltrados().filter((l) => l.etapa === 'novo' && l.situacao === 'andamento');
  return [
    h('div', { class: 'panel' }, h('h2', {}, `Atividades de hoje e atrasadas (${devidos.length})`), devidos.length ? devidos.map(linha) : h('div', { class: 'empty' }, 'Nada pendente. 🎉')),
    h('div', { class: 'panel' }, h('h2', {}, `Próximos 7 dias (${futuros.length})`), futuros.length ? futuros.map(linha) : h('div', { class: 'empty' }, 'Nada agendado.')),
    h('div', { class: 'panel' }, h('h2', {}, `Leads novos aguardando contato (${novos.length})`), novos.length ? novos.map((l) => h('div', { class: 'fu' },
      h('div', { class: 'grow' }, h('b', {}, l.nome), ' ', h('small', {}, `${l.origem} • ${fmtDT(l.criado_em)}`)),
      l.telefone ? h('a', { class: 'btn sm', href: waLink(l.telefone, `Oi ${l.nome.split(' ')[0]}, tudo bem?`), target: '_blank', rel: 'noopener noreferrer' }, 'WhatsApp') : null,
      h('button', { class: 'btn sm ghost', onclick: () => abrirLead(l.id) }, 'Abrir'))) : h('div', { class: 'empty' }, 'Nenhum lead novo esperando.')),
  ];
}
function somaDias(d, n) { const [y, m, dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd + n)).toISOString().slice(0, 10); }

// ---------- painel do mês ----------
async function telaPainel() {
  const p = await run(sb.rpc('painel_mes', { p_mes: S.mes }), 'Não foi possível carregar o painel.');
  S.mes = p.mes;
  const meta = p.meta || {}, c = p.chegaram;
  const kpi = (rot, val) => h('div', { class: 'kpi' }, h('span', {}, rot), h('b', {}, val));
  const progresso = (rot, atual, alvo, fmt) => alvo > 0 ? h('div', { style: 'margin-bottom:12px' }, h('span', {}, `${rot}: ${fmt(atual)} de ${fmt(alvo)} (${pct(atual / alvo)})`),
    h('div', { class: 'bar' }, h('i', { style: `width:${Math.min(100, atual / alvo * 100)}%` }))) : null;
  const fluxo = ['novo', 'contato', 'conversa', 'agendada', 'realizada', 'proposta', 'followup', 'fechado'];
  // Proposta e Fechado são medidos sobre as reuniões realizadas: a venda pode sair na própria reunião, sem proposta.
  const base = (id, i) => (id === 'proposta' || id === 'fechado') ? c.realizada : (i ? c[fluxo[i - 1]] : 0);
  return [
    h('div', { class: 'panel actions' }, h('b', {}, 'Mês:'), h('input', { type: 'month', value: p.mes, style: 'width:auto', onchange: (e) => { S.mes = e.target.value || null; desenhar(); } })),
    h('div', { class: 'kpis' }, kpi('Leads novos', p.leads), kpi('Reuniões agendadas', c.agendada), kpi('Reuniões realizadas', p.reunioes), kpi('Propostas enviadas', p.propostas ?? c.proposta ?? 0), kpi('Vendas', p.vendas),
      kpi('Faturamento', brl(p.receita)), kpi('Reunião → venda', pct(p.conversao_reuniao_venda)), kpi('Lead → reunião', pct(p.conversao_lead_reuniao)),
      kpi('Ticket médio', brl(p.ticket_medio)), kpi('Follow-ups feitos', p.followups_feitos), kpi('Perdidos', p.perdidos)),
    h('div', { class: 'panel' }, h('h2', {}, 'Meta do mês'),
      (meta.receita > 0 || meta.vendas > 0) ? [progresso('Faturamento', p.receita, meta.receita, brl), progresso('Vendas', p.vendas, meta.vendas, (n) => n)]
        : h('div', { class: 'empty' }, 'Ainda sem meta. Defina em Config quando quiser.')),
    h('div', { class: 'panel funnel' }, h('h2', {}, 'Chegaram a cada etapa no mês'),
      h('p', { class: 'empty', style: 'margin-top:-6px' }, 'Cada lead conta pela data em que entrou na etapa, mesmo que já tenha avançado. A % é sobre a etapa anterior; em Proposta enviada e Fechado, sobre as reuniões realizadas (a venda pode sair na própria reunião).'),
      fluxo.map((id, i) => { const n = c[id], prev = base(id, i);
        return h('div', { class: 'row' }, h('span', {}, ROTULO[id]), h('div', { class: 'bar' }, h('i', { style: `width:${n / Math.max(1, c.novo) * 100}%` })), h('b', {}, n), h('small', {}, i && prev ? pct(n / prev) : '')); }),
      h('div', { class: 'row' }, h('span', {}, 'Perdido'), h('div', { class: 'bar' }, h('i', { style: `width:${c.perdido / Math.max(1, c.novo) * 100}%;background:var(--bad)` })), h('b', {}, c.perdido), h('small', {}))),
    h('div', { class: 'panel funnel' }, h('h2', {}, 'Onde estão as negociações em andamento'),
      ETAPAS.map(([id, nome]) => { const n = p.agora[id], max = Math.max(1, ...Object.values(p.agora));
        return h('div', { class: 'row' }, h('span', {}, nome), h('div', { class: 'bar' }, h('i', { style: `width:${n / max * 100}%` })), h('b', {}, n), h('small', {})); }),
      h('div', { class: 'row' }, h('span', {}, '🏆 Ganhas (total)'), h('div', { class: 'bar' }, h('i', { style: 'width:0' })), h('b', {}, p.ganhas_total ?? 0), h('small', {})),
      h('div', { class: 'row' }, h('span', {}, '💔 Perdidas (total)'), h('div', { class: 'bar' }, h('i', { style: 'width:0' })), h('b', {}, p.perdidas_total ?? 0), h('small', {}))),
  ];
}

// ---------- metas do mês (funil de verdade) ----------
// O contorno de cada etapa é a META; o verde por dentro é quanto já foi feito NESTE mês.
// Só verde: o tamanho do verde mostra quanto falta.
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs = {}) { const el = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; }
const numBR = (n) => Number(n || 0).toLocaleString('pt-BR');

async function telaMetas() {
  const p = await run(sb.rpc('painel_mes', { p_mes: null }), 'Não foi possível carregar as metas.'); // sempre o mês corrente
  const m = S.cfg.metas || {}, c = p.chegaram;
  const [ano, mes] = p.mes.split('-').map(Number);
  const nomeMes = new Date(ano, mes - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const etapas = [
    { nome: 'Leads', atual: c.novo, meta: Number(m.leads) || 0 },
    { nome: 'Leads quentes', atual: c.quente, meta: Number(m.quentes) || 0 },
    { nome: 'Reuniões agendadas', atual: c.agendada, meta: Number(m.agendadas) || 0 },
    { nome: 'Reuniões realizadas', atual: c.realizada, meta: Number(m.realizadas) || 0 },
    { nome: 'Vendas', atual: c.fechado, meta: Number(m.vendas) || 0 },
  ];
  const fat = Number(m.faturamento) || 0, rec = Number(p.receita) || 0;
  const semMetas = etapas.every((e) => !e.meta) && !fat;
  const pctDe = (atual, meta) => meta > 0 ? Math.round(atual / meta * 100) : null;
  const razao = (atual, meta) => meta > 0 ? Math.min(1, atual / meta) : 0;

  // Funil à esquerda: contorno = meta; verde por dentro = quanto já foi feito (o tamanho mostra o quanto falta)
  // uma cor por etapa: forte (o que foi feito), suave (fundo do contorno) e linha (contorno)
  const PALETA = [
    { forte: '#2f5bea', suave: '#e8eeff', linha: '#b9c9fb' }, // Leads: azul
    { forte: '#7c3aed', suave: '#f0e8ff', linha: '#d4bcfb' }, // Leads quentes: violeta
    { forte: '#0891b2', suave: '#dff4f9', linha: '#a8dbe8' }, // Reuniões agendadas: ciano
    { forte: '#0d9488', suave: '#dcf5f1', linha: '#a6e0d8' }, // Reuniões realizadas: verde-água
    { forte: '#16a34a', suave: '#e3f6ea', linha: '#b3e3c5' }, // Vendas: verde
  ];
  const SEG = 72, H = SEG * etapas.length, topo = [100, 80, 60, 42, 28], ponta = 16;
  const poly = (wt, wb, f, y0, y1) => `${50 - wt * f / 2},${y0} ${50 + wt * f / 2},${y0} ${50 + wb * f / 2},${y1} ${50 - wb * f / 2},${y1}`;
  const svg = sv('svg', { viewBox: `0 0 100 ${H}`, preserveAspectRatio: 'none', 'aria-hidden': 'true', class: 'm-funil' });
  etapas.forEach((e, i) => {
    const cor = PALETA[i], wt = topo[i], wb = i + 1 < topo.length ? topo[i + 1] : ponta, y0 = i * SEG + 3, y1 = (i + 1) * SEG - 3, r = razao(e.atual, e.meta);
    svg.append(sv('polygon', { points: poly(wt, wb, 1, y0, y1), class: 'f-fora' + (e.meta > 0 ? '' : ' aberta'), style: `fill:${cor.suave};stroke:${cor.linha}`, 'vector-effect': 'non-scaling-stroke' }));
    if (r > 0) svg.append(sv('polygon', { points: poly(wt, wb, r * 0.9, y0 + 4, y1 - 4), class: 'f-dentro', style: `fill:${cor.forte}` }));
  });

  // Barras à direita: uma por etapa, alinhadas com o funil
  const linhas = etapas.map((e, i) => {
    const pc = pctDe(e.atual, e.meta), r = razao(e.atual, e.meta);
    return h('div', { class: 'm-linha', style: `--c:${PALETA[i].forte};--c-line:${PALETA[i].linha}` },
      h('div', { class: 'm-topo' }, h('b', {}, e.nome),
        h('span', { class: 'm-valor' }, h('em', {}, numBR(e.atual)), e.meta > 0 ? h('small', {}, ' / ' + numBR(e.meta)) : h('small', {}, ' • meta em aberto'))),
      h('div', { class: 'm-trilho' + (e.meta > 0 ? '' : ' aberta') }, h('i', { style: `width:${r * 100}%` })),
      h('div', { class: 'm-pct' }, pc === null ? '—' : pc + '%' + (pc >= 100 ? ' ✓' : '')));
  });

  const rf = razao(rec, fat), pf = pctDe(rec, fat);
  const barra = h('div', { class: 'm-fat', style: '--c:#16a34a;--c-line:#b3e3c5' },
    h('div', { class: 'm-fat-topo' }, h('span', { class: 'm-fat-rot' }, 'Faturamento de ' + nomeMes),
      h('span', { class: 'm-valor grande' }, h('em', {}, brl(rec)), fat > 0 ? h('small', {}, ' / ' + brl(fat)) : h('small', {}, ' • meta em aberto'))),
    h('div', { class: 'm-trilho grosso' + (fat > 0 ? '' : ' aberta') }, h('i', { style: `width:${rf * 100}%` })),
    h('div', { class: 'm-pct' }, pf === null ? '—' : pf + '%' + (pf >= 100 ? ' ✓' : '')),
    h('small', { style: 'color:var(--muted)' }, 'Soma só o valor das negociações que você marcou como Ganho neste mês.'));

  return [
    semMetas ? h('div', { class: 'panel', style: 'border-color:#bfe3cd;background:#f0faf4' }, 'Você ainda não definiu as metas. ',
      h('button', { class: 'btn sm', onclick: () => { S.view = 'config'; desenhar(); } }, 'Definir metas'),
      ' Enquanto isso, o funil mostra o que você já fez no mês.') : null,
    h('div', { class: 'm-card' },
      h('div', { class: 'm-cab' }, h('span', { class: 'm-pill' }, 'Funil do mês'), h('span', { class: 'm-mes' }, nomeMes)),
      h('p', { class: 'm-desc' }, 'Sempre o mês atual. O contorno de cada etapa é a meta; a área verde mostra quanto já foi atingido. Lead que virou quente conta no mês, mesmo que já tenha avançado de etapa.'),
      h('div', { class: 'm-corpo' }, svg, h('div', { class: 'm-linhas' }, ...linhas)),
      barra),
  ].filter(Boolean);
}

// ---------- config ----------
function telaConfig() {
  const mt = S.cfg.metas || {}, msgs = S.cfg.mensagens || [];
  const campoMeta = (chave, rot, ex) => ({ chave, label: h('label', {}, rot,
    h('input', { type: 'number', min: '0', step: chave === 'faturamento' ? '0.01' : '1', placeholder: 'ex.: ' + ex, value: mt[chave] || '' })) });
  const metas = [campoMeta('faturamento', 'Faturamento do mês (R$)', '30000'), campoMeta('leads', 'Leads', '500'), campoMeta('quentes', 'Leads quentes', '300'),
    campoMeta('agendadas', 'Reuniões agendadas', '60'), campoMeta('realizadas', 'Reuniões realizadas', '50'), campoMeta('vendas', 'Vendas', '10')];
  const tpl = msgs.map((m, i) => h('label', {}, `Follow-up ${i + 1}`, h('textarea', {}, m)));
  return [
    h('div', { class: 'panel' }, h('h2', {}, 'Metas do mês'),
      h('p', { class: 'empty' }, 'Preencha o que quiser. O que ficar em branco aparece como "meta em aberto" na tela Metas. Valem para o mês corrente e para os próximos, até você mudar.'),
      h('div', { class: 'grid3' }, ...metas.map((x) => x.label))),
    h('div', { class: 'panel' }, h('h2', {}, 'Mensagens de follow-up (WhatsApp)'),
      h('p', { class: 'empty' }, 'Use {nome} para o primeiro nome do lead. Dias: 1º = 1 dia após a reunião, 2º = +3, 3º = +1, 4º = +2.'), tpl),
    h('div', { class: 'actions' },
      h('button', { class: 'btn', onclick: async () => {
        const valores = Object.fromEntries(metas.map((x) => [x.chave, Number(x.label.lastChild.value) || 0]).filter(([, v]) => v > 0));
        await run(sb.from('configuracoes').upsert([
          { chave: 'metas', valor: valores },
          { chave: 'meta', valor: { receita: valores.faturamento || 0, vendas: valores.vendas || 0 } }, // usada no bloco de meta do Painel
          { chave: 'mensagens', valor: tpl.map((l) => l.lastChild.value.slice(0, 1000)) }]), 'Não foi possível salvar.');
        await carregar(); toast('Salvo!');
      } }, 'Salvar configurações'),
      h('button', { class: 'btn ghost', onclick: exportarCsv }, 'Exportar leads (CSV)')),
    h('p', { class: 'empty' }, 'Dica: exporte o CSV toda semana. O plano gratuito do Supabase não faz backup automático.'),
  ];
}
function exportarCsv() {
  const cel = (v) => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replaceAll('"', '""') + '"'; }; // evita fórmulas maliciosas no Excel
  const cols = ['nome', 'email', 'telefone', 'etapa', 'origem', 'situacao', 'valor_venda', 'motivo_perda', 'reuniao_em', 'reuniao_realizada_em', 'fechado_em', 'criado_em'];
  const csv = '﻿' + [cols.join(',')].concat(S.leads.map((l) => cols.map((c) => cel(l[c])).join(','))).join('\r\n');
  const a = h('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), download: `leads-${hoje()}.csv` });
  document.body.append(a); a.click(); a.remove();
}

// ---------- início ----------
sb.auth.onAuthStateChange((evento, sessao) => {
  if (evento === 'SIGNED_OUT' || !sessao) { S.leads = []; S.cfg = {}; S.proximo = {}; closeDialog(); telaLogin(); }
  else if (evento === 'SIGNED_IN' || evento === 'INITIAL_SESSION') abrirApp();
});
