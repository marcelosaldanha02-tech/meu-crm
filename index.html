<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; connect-src https://edvkntjdlovqshjpuafv.supabase.co; img-src data:; base-uri 'none'; form-action 'none'">
<title>Meu CRM</title>
<style>
  :root {
    color-scheme: light; /* só modo claro: barras de rolagem e campos também ficam claros */
    --bg:#f3f6fd; --card:#fff; --text:#1c2230; --muted:#6b7385; --line:#e3e6ec;
    --brand:#2f5bea; --brand-d:#2448c0; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:10px 16px; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 6px 0 0; line-height:0; }
  .topo-logo { display:block; height:34px; width:auto; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav button { background:none; border:0; padding:8px 12px; border-radius:8px; color:var(--muted); font:inherit; cursor:pointer; }
  nav button.on { background:var(--brand); color:#fff; }
  nav .badge { background:var(--bad); color:#fff; border-radius:10px; font-size:11px; padding:1px 6px; margin-left:4px; }
  .spacer { flex:1; }
  button.btn { background:var(--brand); color:#fff; border:0; padding:8px 14px; border-radius:8px; font:inherit; cursor:pointer; }
  button.btn:hover { background:var(--brand-d); }
  button.btn:disabled { opacity:.6; cursor:wait; }
  button.btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button.btn.ok { background:var(--ok); } button.btn.bad { background:var(--bad); }
  button.btn.sm { padding:4px 10px; font-size:12px; }
  a.btn { text-decoration:none; display:inline-block; }
  main { padding:16px; }
  .search { flex:1 1 220px; max-width:360px; }
  .board { display:grid; grid-template-columns:repeat(var(--cols,6), minmax(190px,1fr)); gap:10px; overflow-x:auto; align-items:start; scroll-snap-type:x proximity; padding-bottom:8px; }
  .col { background:var(--card); border:1px solid var(--line); border-top:5px solid var(--c, var(--line)); border-radius:14px; min-height:160px; scroll-snap-align:start; box-shadow:0 2px 10px rgba(40,60,120,.07); }
  .col.over { outline:2px dashed var(--brand); }
  .col h3 { margin:0; padding:10px 12px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--c, var(--muted)); background:var(--c-bg, transparent); border-radius:9px 9px 0 0; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .col h3 .contagem { background:#fff; color:var(--c, var(--muted)); border-radius:999px; min-width:24px; padding:1px 8px; text-align:center; font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .col .cards { padding:8px; display:flex; flex-direction:column; gap:8px; }
  .lead { background:#fff; border:1px solid var(--line); border-left:5px solid var(--c, var(--line)); border-radius:12px; padding:10px 12px; cursor:pointer; box-shadow:0 1px 4px rgba(40,60,120,.10); transition:transform .15s ease, box-shadow .15s ease; }
  .lead:hover { transform:translateY(-2px); box-shadow:0 8px 18px rgba(40,60,120,.18); }
  .lead .topo { display:flex; align-items:center; gap:10px; }
  .avatar { width:36px; height:36px; flex:none; border-radius:50%; background:var(--c-bg, var(--line)); color:var(--c, var(--muted)); display:grid; place-items:center; font-weight:800; font-size:15px; }
  @media (prefers-reduced-motion: reduce) { .lead { transition:none; } .lead:hover { transform:none; } }
  .lead b { display:block; overflow-wrap:anywhere; } .lead small { color:var(--muted); overflow-wrap:anywhere; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; background:var(--line); color:var(--muted); margin-top:4px; }
  .tag.late { background:var(--bad); color:#fff; } .tag.today { background:var(--warn); color:#fff; } .tag.won { background:var(--ok); color:#fff; }
  /* Negociação ganha = verde, perdida = vermelho (card do quadro, listas e janela do card) */
  .lead.ganha { background:rgba(22,163,74,.16); border-color:var(--ok); border-left-width:5px; }
  .lead.perdida { background:rgba(220,38,38,.14); border-color:var(--bad); border-left-width:5px; }
  .panel .fu.ganha, .panel .fu.perdida { border:1px solid; border-left-width:5px; border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .panel .fu.ganha { background:rgba(22,163,74,.16); border-color:var(--ok); }
  .panel .fu.perdida { background:rgba(220,38,38,.14); border-color:var(--bad); }
  dialog.ganha { border:2px solid var(--ok); border-top:8px solid var(--ok); }
  dialog.perdida { border:2px solid var(--bad); border-top:8px solid var(--bad); }
  .tag.lost { background:var(--bad); color:#fff; }
  /* Tela de Metas: cores do CRM (card branco, azul da marca nos detalhes) e VERDE no que foi atingido. Sem vermelho nem amarelo. */
  .m-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 22px; box-shadow:0 2px 10px rgba(40,60,120,.07); }
  .m-cab { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  /* cada etapa tem a sua cor (definida na PALETA, em telaMetas) */
  .m-pill { background:#e6edff; color:var(--brand); font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; border-radius:999px; padding:5px 14px; }
  .m-mes { color:var(--muted); }
  .m-desc { color:var(--muted); font-size:13px; max-width:760px; margin:12px 0 20px; }
  .m-corpo { display:grid; grid-template-columns:minmax(160px,230px) 1fr; gap:26px; align-items:start; }
  .m-funil { width:100%; height:360px; display:block; }
  .f-fora { fill:#eef7f1; stroke:#bfe3cd; stroke-width:1.5; }
  .f-fora.aberta { fill:#f7fbf8; stroke-dasharray:5 4; }
  .f-dentro { fill:#16a34a; }
  .m-linhas { display:flex; flex-direction:column; }
  .m-linha { height:72px; display:flex; flex-direction:column; justify-content:center; gap:5px; border-bottom:1px solid var(--line); }
  .m-linha:last-child { border-bottom:0; }
  .m-topo, .m-fat-topo { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .m-valor em { font-style:normal; font-weight:800; font-size:19px; color:var(--c, #15803d); } .m-valor small { color:var(--muted); font-size:13px; }
  .m-valor.grande em { font-size:24px; }
  .m-trilho { height:8px; background:var(--line); border-radius:999px; overflow:hidden; } .m-trilho.grosso { height:12px; }
  .m-trilho.aberta { background:transparent; border:1px dashed var(--c-line, #bfe3cd); }
  .m-trilho i { display:block; height:100%; background:var(--c, #16a34a); border-radius:999px; transition:width .5s ease; }
  .m-pct { font-size:11px; font-weight:700; color:var(--muted); text-align:right; }
  .m-fat { margin-top:20px; border-top:1px solid var(--line); padding-top:16px; display:flex; flex-direction:column; gap:7px; }
  .m-fat-rot { color:var(--muted); font-weight:600; }
  @media (max-width:760px) {
    .m-corpo { grid-template-columns:1fr; }
    .m-funil { max-width:240px; height:240px; margin:0 auto; }
    .m-linha { height:auto; padding:10px 0; }
  }
  .panel.resumo { font-weight:700; padding:10px 14px; margin-bottom:12px; }
  .panel.resumo.ganha { background:rgba(22,163,74,.16); border-color:var(--ok); }
  .panel.resumo.perdida { background:rgba(220,38,38,.14); border-color:var(--bad); }
  .tag.resp { background:#eef2ff; color:#3730a3; }
  .btn.wa { background:#25d366; color:#fff; } .btn.wa:hover { background:#1ebe5b; }
  /* sino de avisos e checklist */
  .sino { position:relative; background:none; border:0; font-size:20px; cursor:pointer; padding:4px 8px; border-radius:999px; line-height:1; }
  .sino:hover { background:var(--line); }
  .sino-n { position:absolute; top:-3px; right:-3px; background:var(--bad); color:#fff; border-radius:999px; font-size:11px; font-weight:700; min-width:18px; height:18px; display:grid; place-items:center; padding:0 4px; }
  .sino-n.mini { position:static; margin-left:6px; min-width:16px; height:16px; font-size:10px; }
  .painel-sino { position:fixed; top:56px; right:12px; width:min(420px,94vw); max-height:72vh; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 16px 48px rgba(40,60,120,.25); z-index:70; overflow:hidden; }
  .sino-topo { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); }
  .sino-abas { display:flex; gap:4px; padding:6px 10px 0; border-bottom:1px solid var(--line); }
  .sino-aba { background:none; border:0; padding:8px 14px; font:inherit; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; display:inline-flex; align-items:center; }
  .sino-aba.on { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }
  .sino-lista { overflow:auto; }
  .sino-item { display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; background:var(--card); border:0; border-bottom:1px solid var(--line); padding:11px 14px; font:inherit; color:var(--text); cursor:pointer; }
  .sino-item:hover { background:var(--bg); } .sino-item.novo { background:#f3f6ff; }
  .sino-ic { font-size:18px; } .sino-tx { flex:1; min-width:0; overflow-wrap:anywhere; } .sino-tx small { display:block; color:var(--muted); }
  .sino-ponto { width:9px; height:9px; border-radius:50%; background:var(--brand); margin-top:6px; flex:none; }
  .ck-linha { display:grid; grid-template-columns:minmax(140px,1.2fr) 120px 1.4fr; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .ck-nome small, .ck-prog small { display:block; color:var(--muted); } .ck-prog small.ok { color:#15803d; font-weight:700; }
  .ck-tab { border-collapse:collapse; width:100%; } .ck-tab th, .ck-tab td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13px; white-space:nowrap; } .ck-tab th { color:var(--muted); font-weight:600; }
  .ck-ok { color:#15803d; font-weight:600; } .ck-falta { color:#b45309; font-weight:600; } .ck-tab small { color:var(--muted); font-weight:400; display:inline; }
  @media (max-width:700px) { .ck-linha { grid-template-columns:1fr; } .painel-sino { top:8px; right:8px; max-height:80vh; } }
  .quem { display:inline-flex; align-items:center; gap:8px; background:none; border:0; color:var(--muted); font:inherit; font-size:13px; white-space:nowrap; cursor:pointer; padding:3px 8px 3px 4px; border-radius:999px; }
  .quem:hover { background:var(--line); }
  .av { border-radius:50%; object-fit:cover; flex:none; display:inline-grid; place-items:center; vertical-align:middle; }
  .av-ini { background:#e6edff; color:var(--brand); font-weight:700; }
  .foto-previa { display:flex; justify-content:center; padding:6px 0; }
  .linha select { flex:1; }
  .papel-sel { width:auto; padding:4px 8px; font-size:13px; }
  .convite-link { font-size:12px; }
  .aviso-convite { background:#eef2ff; border:1px solid #c7d2fe; color:#3730a3; border-radius:8px; padding:10px 12px; margin-bottom:10px; font-size:13px; }
  .tag.cold { background:#dbeafe; color:#1e40af; }
  .tag.hot { background:var(--bad); color:#fff; } .tag.warm { background:var(--warn); color:#fff; } .tag.rep { background:var(--brand); color:#fff; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; } .chips .tag { margin:0; }
  .qa { padding:8px 0; border-bottom:1px solid var(--line); } .qa:last-child { border:0; }
  .qa small { color:var(--muted); display:block; } .qa div { overflow-wrap:anywhere; }
  select.filtro { width:auto; }
  .confete { position:fixed; inset:0; width:100vw; height:100vh; margin:0; padding:0; border:0; background:transparent; overflow:visible; pointer-events:none; }
  .comemora { position:fixed; inset:auto; top:22px; left:50%; transform:translateX(-50%); margin:0; border:0; background:var(--ok); color:#fff; font-weight:600; font-size:16px;
    padding:12px 22px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.25); max-width:90vw; text-align:center; pointer-events:none; animation:sobe .35s ease-out; }
  @keyframes sobe { from { opacity:0; transform:translate(-50%,-14px); } to { opacity:1; transform:translate(-50%,0); } }
  dialog.largo { width:min(1040px,96vw); }
  .cardhead { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .cardcols { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  .col2 { display:flex; flex-direction:column; gap:16px; min-width:0; }
  .sec { display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--line); padding-top:12px; }
  .sec h3 { margin:0; font-size:13px; } .grid3 { display:grid; grid-template-columns:1.2fr 1fr .8fr; gap:10px; }
  .linha { display:flex; gap:8px; align-items:center; } .linha input { flex:1; }
  .fu.feita { color:var(--muted); text-decoration:line-through; }
  button.x { background:none; border:0; color:inherit; cursor:pointer; padding:0 2px; font-size:13px; }
  .cardfoot { display:flex; gap:8px; align-items:center; position:sticky; bottom:0; background:var(--card); padding-top:12px; border-top:1px solid var(--line); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .panel h2 { margin:0 0 12px; font-size:15px; }
  .fu { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .fu:last-child { border:0; } .grow { flex:1; min-width:140px; overflow-wrap:anywhere; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .kpi span { color:var(--muted); font-size:12px; } .kpi b { display:block; font-size:22px; margin-top:4px; }
  .bar { height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin-top:6px; } .bar i { display:block; height:100%; background:var(--brand); }
  .funnel .row { display:flex; align-items:center; gap:10px; margin:6px 0; } .funnel .row span { width:130px; color:var(--muted); }
  .funnel .row .bar { flex:1; margin:0; } .funnel .row b { width:30px; text-align:right; } .funnel .row small { width:44px; color:var(--muted); }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--text); padding:0; width:min(660px,96vw); max-height:92vh; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dlg { padding:18px; display:flex; flex-direction:column; gap:12px; }
  .dlg h2 { margin:0; font-size:17px; overflow-wrap:anywhere; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  input, textarea, select { font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); width:100%; }
  /* Opções dos menus suspensos com cores fixas (texto escuro em fundo branco) para sempre aparecerem */
  select option, select optgroup { background-color:#fff; color:#1c2230; }
  textarea { min-height:70px; resize:vertical; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tl { max-height:220px; overflow:auto; font-size:13px; border-top:1px solid var(--line); padding-top:8px; }
  .tl div { padding:3px 0; color:var(--muted); } .tl b { color:var(--text); font-weight:500; }
  .empty { color:var(--muted); padding:8px 0; }
  /* Fundo do login: poucos brilhos suaves (azul, violeta, verde-água) e uma malha de pontos quase invisível. */
  .login-wrap { min-height:100vh; display:grid; place-items:center; padding:24px 16px;
    background:
      radial-gradient(820px 520px at 6% 4%, rgba(47,91,234,.17), transparent 62%),
      radial-gradient(760px 520px at 96% 96%, rgba(124,58,237,.13), transparent 62%),
      radial-gradient(560px 380px at 88% 6%, rgba(13,148,136,.11), transparent 62%),
      radial-gradient(rgba(28,34,48,.075) 1px, transparent 1.3px) 0 0 / 28px 28px,
      #f4f7fe; }
  .login { box-shadow:0 14px 44px rgba(40,60,120,.13), 0 2px 6px rgba(40,60,120,.06); }
  .login-logo { display:block; width:min(300px,82%); height:auto; margin:0 auto 10px; }
  .login { width:100%; max-width:380px; margin:0 auto; padding:24px; background:var(--card); border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; gap:12px; }
  .err { color:var(--bad); min-height:1.2em; }
  #toast { position:fixed; inset:auto; margin:0; border:0; left:50%; bottom:20px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:8px; z-index:99; max-width:90vw; }
  @media (max-width:700px) {
    header { position:static; }
    .grid2, .grid3, .cardcols { grid-template-columns:1fr; }
    .board { grid-template-columns:repeat(var(--cols,6), 78vw); }
    .funnel .row span { width:96px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" popover="manual" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
        integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script>
'use strict';
// Não deixa o CRM abrir dentro de outro site (evita "clique enganado"): se estiver embutido, some e tenta abrir sozinho.
if (window.top !== window.self) {
  document.documentElement.hidden = true;
  try { window.top.location.replace(window.self.location.href); } catch { /* sem permissão: fica escondido */ }
  throw new Error('CRM não abre dentro de outro site');

function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

let toastTimer;
function toast(msg) {
  // "popover" faz o aviso aparecer por cima até das janelas abertas (card, perguntas)
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  try { t.showPopover?.(); } catch { /* já está aberto */ }
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; try { t.hidePopover?.(); } catch { /* ok */ } }, 4000);
}
async function run(promise, falha = 'Algo deu errado. Tente de novo.') {
  const { data, error } = await promise;
  if (error) { console.error(error); toast(falha); throw error; }
  return data;
}

function ask(titulo, campos) {
  return new Promise((resolve) => {
    const inputs = campos.map((c) => {
      const el = c.type === 'textarea' ? h('textarea', { name: c.name })
        : c.type === 'select' ? h('select', { name: c.name }, h('option', { value: '' }, 'Escolha uma opção...'), ...c.options.map((o) => h('option', { value: o }, o)))
        : h('input', { name: c.name, type: c.type || 'text', step: c.step, min: c.min });
      if (c.value != null) el.value = c.value;
      return h('label', {}, c.label, el);
    });
    let feito = false;
    const fim = (v) => { if (!feito) { feito = true; closeDialog(); resolve(v); } };
    dlg.onclose = () => { if (!dlg.open) fim(null); }; // ignora o fechamento do card anterior
    openDialog(h('h2', {}, titulo), ...inputs, h('div', { class: 'actions' },
      h('button', { class: 'btn', onclick: () => {
        const vals = Object.fromEntries(inputs.map((l) => [l.lastChild.name, l.lastChild.value]));
        const falta = campos.find((c) => c.required && !String(vals[c.name]).trim());
        if (falta) { toast('Escolha: ' + falta.label.toLowerCase() + '.'); return; } // a janela continua aberta
        fim(vals);
      } }, 'Confirmar'),
      h('button', { class: 'btn ghost', onclick: () => fim(null) }, 'Cancelar')));
    inputs[0]?.lastChild.focus();
  });
}

const FRASES = ['Reunião marcada! 🎉', 'Mais um passo rumo à venda!', 'Agenda cheia é negócio andando.', 'Reunião agendada. Bora fechar!', 'Pequena vitória, grande caminho.', 'Boa! Mais uma conversa na mesa.'];

function noTopo(el) { document.body.append(el); try { el.showPopover?.(); } catch { /* navegador antigo: fica na página mesmo */ } }
function celebrar() {
  const aviso = h('div', { class: 'comemora', role: 'status', popover: 'manual' }, FRASES[Math.floor(Math.random() * FRASES.length)]);
  noTopo(aviso); setTimeout(() => aviso.remove(), 3600);
  const cv = h('canvas', { class: 'confete', 'aria-hidden': 'true', popover: 'manual' });
  cv.width = innerWidth; cv.height = innerHeight; noTopo(cv);
  const ctx = cv.getContext('2d'), cores = ['#2f5bea', '#16a34a', '#d97706', '#dc2626', '#a855f7', '#facc15'];
  const ps = Array.from({ length: 150 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .4, vx: (Math.random() - .5) * 4,
    vy: 2 + Math.random() * 4, r: 5 + Math.random() * 6, a: Math.random() * 6.28, va: (Math.random() - .5) * .3, c: cores[Math.floor(Math.random() * cores.length)] }));
  const fim = performance.now() + 2800;
  (function quadro(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.vy += .05; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ctx.restore(); }
    if (t < fim) requestAnimationFrame(quadro); else cv.remove();
  })(performance.now());
}

// ---------- dados ----------
async function carregar() {
  const leads = []; // o Supabase devolve no máximo 1000 linhas por vez: busca em páginas
  for (let ini = 0; ; ini += 1000) {
    const lote = await run(sb.from('leads').select('*').order('atualizado_em', { ascending: false }).range(ini, ini + 999));
    leads.push(...lote); if (lote.length < 1000) break;
  }
  S.leads = leads;
  const fus = await run(sb.from('followups').select('id,lead_id,numero,data_prevista').eq('status', 'pendente').order('data_prevista'));
  S.proximo = {}; S.fups = fus;
  for (const f of fus) if (!S.proximo[f.lead_id]) S.proximo[f.lead_id] = f; // o mais próximo de cada lead
  const cfg = await run(sb.from('configuracoes').select('chave,valor'));
  S.cfg = Object.fromEntries(cfg.map((c) => [c.chave, c.valor]));
  S.ativ = await run(sb.from("atividades").select("*").is("feito_em", null).order("vence_em"));
  S.atrasados = fus.filter((f) => f.data_prevista <= hoje()).length + S.ativ.filter((x) => x.vence_em <= hoje()).length;
  // equipe (tolerante: se o SQL ainda não foi rodado, segue sem equipe)
  { const { data } = await sb.from('equipe').select('*').order('nome'); S.equipe = data || []; }
  const et = await run(sb.from('etiquetas').select('lead_id,texto').order('criado_em'));
  S.etiq = {}; for (const e of et) (S.etiq[e.lead_id] ||= []).push(e.texto);
  if (ehGestor()) {   // metas do checklist (só o gestor edita; tolerante se o SQL ainda não foi rodado)
    const a = await sb.from('checklist_metricas').select('*').order('ordem').order('id'), b = await sb.from('checklist_metas').select('*');
    S.ck = { metricas: a.data || [], metas: b.data || [] };
  }
  atualizarAvisos();
}

// Situação da negociação: em andamento, ganha ou perdida. O card NÃO muda de coluna: só muda de cor.
function passaSituacao(l) {
  return S.sit === 'todas' || (S.sit === 'andamento' && l.situacao === 'andamento')
    || (S.sit === 'ganhas' && l.situacao === 'ganha') || (S.sit === 'perdidas' && l.situacao === 'perdida');
}
function quadro() {
  const lista = leadsFiltrados().filter(passaSituacao), t = hoje();
  const board = h('div', { class: 'board', style: `--cols:${ETAPAS.length}` }, ...ETAPAS.map(([id, nome]) => {
    const itens = lista.filter((l) => l.etapa === id);
    const col = h('div', { class: 'col', 'data-etapa': id, style: `--c:${COR[id][0]};--c-bg:${COR[id][1]}` },
      h('h3', {}, h('span', {}, COR[id][2] + ' ' + nome), h('span', { class: 'contagem' }, itens.length)),
      h('div', { class: 'cards' }, itens.length ? itens.map((l) => cartao(l, t)) : h('div', { class: 'empty' }, '—')));
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', (e) => {
      e.preventDefault(); col.classList.remove('over');
      const lead = S.leads.find((l) => l.id === e.dataTransfer.getData('text/plain'));
      if (lead && lead.etapa !== id) mover(lead, id);
    });
    return col;
  }));
  if (S.sit !== 'ganhas' && S.sit !== 'perdidas') return board;
  const ganhas = S.sit === 'ganhas', n = lista.length, total = lista.reduce((s, l) => s + Number(l.valor_venda || 0), 0);
  return h('div', {}, h('div', { class: 'panel resumo ' + (ganhas ? 'ganha' : 'perdida') },
    ganhas ? `🏆 ${n} ${n === 1 ? 'negociação ganha' : 'negociações ganhas'} • ${brl(total)}`
      : `💔 ${n} ${n === 1 ? 'negociação perdida' : 'negociações perdidas'}`), board);
}
function cartao(l, t) {
  const fu = S.proximo[l.id];
  let tag = null;
  if (l.situacao === 'ganha') tag = h('span', { class: 'tag won' }, '🏆 ' + brl(l.valor_venda));
  else if (l.situacao === 'perdida') tag = h('span', { class: 'tag lost' }, '💔 ' + (l.motivo_perda || 'Perdida'));
  else if (fu) tag = h('span', { class: 'tag ' + (fu.data_prevista < t ? 'late' : fu.data_prevista === t ? 'today' : '') }, `Follow-up ${fu.numero} • ${fmtDay(fu.data_prevista).slice(0, 5)}`);
  else if (l.etapa === 'agendada' && l.reuniao_em) tag = h('span', { class: 'tag' }, fmtDT(l.reuniao_em));
  const temp = TEMP[l.temperatura], rep = (S.etiq[l.id] || []).length, quem = (S.equipe || []).find((m) => m.id === l.responsavel_id);
  const acoesFu = (l.etapa === 'followup' && fu && l.situacao === 'andamento') ? cartaoAcoesFollowup(l, fu) : null;
  const el = h('div', { class: 'lead' + (l.situacao === 'ganha' ? ' ganha' : l.situacao === 'perdida' ? ' perdida' : ''), draggable: 'true', onclick: () => abrirLead(l.id) },
    h('div', { class: 'topo' }, h('span', { class: 'avatar', 'aria-hidden': 'true' }, (l.nome.trim()[0] || '?').toUpperCase()),
      h('div', { style: 'min-width:0' }, h('b', {}, l.nome), h('small', {}, l.telefone ? '+' + l.telefone : l.email))),
    (temp || rep || tag || quem) ? h('div', { class: 'chips', style: 'margin-top:4px' },
      temp ? h('span', { class: 'tag ' + temp[1] }, temp[0]) : null,
      rep ? h('span', { class: 'tag rep', title: S.etiq[l.id].join('\n') }, `↻ Preencheu de novo${rep > 1 ? ' ×' + rep : ''}`) : null,
      tag, quem ? h('span', { class: 'tag resp', style: 'display:inline-flex;align-items:center;gap:4px' }, quem.foto ? avatar(quem, 16) : '👤', quem.nome) : null) : null,
    acoesFu);
  el.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', l.id));
  return el;
}
// Na etapa Follow-up: WhatsApp com a mensagem pronta e "Feito" direto no card
function cartaoAcoesFollowup(l, fu) {
  const msgs = S.cfg.mensagens || [], parar = (e) => e.stopPropagation(); // os botões não abrem o card
  const texto = (msgs[fu.numero - 1] || '').replaceAll('{nome}', l.nome.split(' ')[0]);
  const [a, b, c] = fu.data_prevista.split('-').map(Number), [x, y, z] = hoje().split('-').map(Number);
  const dias = Math.round((Date.UTC(x, y - 1, z) - Date.UTC(a, b - 1, c)) / 864e5);
  return h('div', { style: 'margin-top:6px' },
    dias > 0 ? h('small', { style: 'color:var(--bad)' }, `Atrasado ${dias} ${dias === 1 ? 'dia' : 'dias'}`) : null,
    h('div', { class: 'actions', style: 'margin-top:4px' },
      l.telefone ? h('a', { class: 'btn sm', href: waLink(l.telefone, texto), target: '_blank', rel: 'noopener noreferrer', onclick: parar }, 'WhatsApp') : null,
      h('button', { class: 'btn sm ok', type: 'button', onclick: async (e) => {
        parar(e); await run(sb.from('followups').update({ status: 'feito' }).eq('id', fu.id)); await recarregar();
      } }, 'Feito')));
}
async function mover(lead, etapa) {
  const upd = { etapa };
  if (etapa === 'agendada') {
    const r = await ask('Reunião agendada', [{ name: 'd', label: 'Data e hora (opcional)', type: 'datetime-local', value: toLocalInput(lead.reuniao_em) }]);
    if (!r) return; if (r.d) upd.reuniao_em = fromLocalInput(r.d);
  }
  await run(sb.from('leads').update(upd).eq('id', lead.id), 'Não foi possível mover o lead.');
  if (etapa === 'agendada') celebrar();
  await recarregar();
}
// Ganho / Perdido: o card continua na MESMA coluna, só muda de cor (verde ou vermelho)
async function encerrar(lead, situacao) {
  const upd = { situacao };
  if (situacao === 'ganha') {
    const r = await ask('Valor da venda', [{ name: 'v', label: 'Valor (R$)', type: 'number', step: '0.01', min: '0', value: lead.valor_venda || '' }]);
    if (!r) return; upd.valor_venda = Number(r.v) || 0;
  } else if (situacao === 'perdida') {
    const r = await ask('Por que a negociação foi perdida?', [{ name: 'm', label: 'Motivo da perda', type: 'select', required: true,
      options: MOTIVOS_PERDA, value: MOTIVOS_PERDA.includes(lead.motivo_perda) ? lead.motivo_perda : '' }]);
    if (!r) return; upd.motivo_perda = r.m;
  }
  await run(sb.from('leads').update(upd).eq('id', lead.id), 'Não foi possível atualizar a negociação.');
  const onde = ROTULO[lead.etapa];
  if (situacao === 'andamento') toast('Negociação reaberta.');
  else if (S.sit === 'andamento') toast((situacao === 'ganha' ? 'Negociação ganha! ' : 'Negociação perdida. ') + 'O card continua em "' + onde + '", agora em '
    + (situacao === 'ganha' ? 'verde' : 'vermelho') + '. Para vê-lo, use o filtro "Negociações: ' + (situacao === 'ganha' ? 'Ganhas' : 'Perdidas') + '" ou "Todas".');
  else toast(situacao === 'ganha' ? 'Negociação ganha! 🏆' : 'Negociação marcada como perdida.');
  await recarregar();
}

// ---------- novo lead ----------
async function novoLead() {
  const r = await ask('Novo lead', [
    { name: 'nome', label: 'Nome' }, { name: 'telefone', label: 'Telefone / WhatsApp' }, { name: 'email', label: 'E-mail', type: 'email' }]);
  if (!r) return;
  if (!r.nome.trim()) return toast('O nome é obrigatório.');
  await run(sb.from('leads').insert({ nome: r.nome.trim().slice(0, 200), telefone: r.telefone.slice(0, 20), email: r.email.trim().slice(0, 254), origem: 'manual' }), 'Não foi possível criar o lead.');
  await recarregar();
}

// ---------- card aberto ----------
async function abrirLead(id) {
  const [lead] = await run(sb.from('leads').select('*').eq('id', id));
  if (!lead) return;
  const [hist, notas, fus, etiq, envios, ativ] = await Promise.all([
    run(sb.from('historico_etapas').select('*').eq('lead_id', id).order('entrou_em')),
    run(sb.from('anotacoes').select('*').eq('lead_id', id).order('criado_em', { ascending: false })),
    run(sb.from('followups').select('*').eq('lead_id', id).order('numero')),
    run(sb.from('etiquetas').select('*').eq('lead_id', id).order('criado_em')),
    run(sb.from('respostas_formulario').select('*').eq('lead_id', id).order('enviado_em')),
    run(sb.from('atividades').select('*').eq('lead_id', id).order('vence_em')),
  ]);
  const campo = (rot, el) => h('label', {}, rot, el);
  const secao = (titulo, ...filhos) => h('section', { class: 'sec' }, h('h3', {}, titulo), ...filhos);

  // --- campos da esquerda
  const nome = h('input', { value: lead.nome, maxlength: 200 });
  const tel = h('input', { value: lead.telefone, inputmode: 'tel', maxlength: 20 });
  const mail = h('input', { value: lead.email, type: 'email', maxlength: 254 });
  const valor = h('input', { type: 'number', step: '0.01', min: '0', value: lead.valor_venda || '' });
  const obs = h('textarea', { maxlength: 5000 }, lead.observacao || '');
  const estagio = h('select', {}, ...ETAPAS.map(([e, n]) => h('option', { value: e, selected: e === lead.etapa }, n)));
  const nota = h('textarea', { placeholder: 'Registre o que conversaram...', maxlength: 5000 });
  // temperatura: automática (pelo formulário) ou escolhida por você (o formulário não sobrescreve)
  const tempAtual = lead.temperatura_manual ? (lead.temperatura || 'sem') : 'auto';
  const rotAuto = lead.temperatura_manual ? 'Automática (pelo formulário)' : 'Automática (' + (TEMP[lead.temperatura] ? TEMP[lead.temperatura][0] : 'sem classificação') + ')';
  const selTemp = h('select', {}, ...[['auto', rotAuto], ['quente', '🔥 Quente'], ['morno', '🌤️ Morno'], ['frio', '🧊 Frio'], ['sem', 'Sem classificação']]
    .map(([v, r]) => h('option', { value: v, selected: v === tempAtual }, r)));
  // responsável: pessoas ativas da equipe (mais a atual, se já estiver inativa)
  const selResp = h('select', { disabled: !ehGerencia(), title: ehGerencia() ? '' : 'Só o gestor ou o gerente troca o responsável' }, h('option', { value: '' }, 'Sem responsável'),
    ...(S.equipe || []).filter((m) => m.ativo || m.id === lead.responsavel_id)
      .map((m) => h('option', { value: String(m.id), selected: m.id === lead.responsavel_id }, m.nome + (m.ativo ? '' : ' (inativo)'))));

  // Só envia temperatura/responsável se você mexeu neles (assim o card salva normalmente em qualquer situação)
  const camposNovos = () => {
    const extra = {};
    if (selTemp.value !== tempAtual) {
      if (selTemp.value === 'auto') extra.temperatura_manual = false;
      else { extra.temperatura = selTemp.value === 'sem' ? '' : selTemp.value; extra.temperatura_manual = true; }
    }
    if ((selResp.value || '') !== String(lead.responsavel_id ?? '')) extra.responsavel_id = selResp.value ? Number(selResp.value) : null;
    return extra;
  };
  // Salva o que está digitado antes de qualquer ação que recarrega o card (nada se perde)
  // Grava SÓ o que esta pessoa alterou desde que abriu o card. Assim, se outra pessoa mudou outro campo no meio tempo,
  // a alteração dela não é desfeita por uma gravação com dados velhos.
  const guardar = () => {
    const novo = {
      nome: nome.value.trim().slice(0, 200) || 'Sem nome', telefone: tel.value.slice(0, 20), email: mail.value.trim().slice(0, 254),
      valor_venda: Number(valor.value) || 0, observacao: obs.value.slice(0, 5000),
    }, antes = { nome: lead.nome, telefone: lead.telefone, email: lead.email, valor_venda: Number(lead.valor_venda) || 0, observacao: lead.observacao || '' };
    const upd = {};
    for (const k of Object.keys(novo)) if (novo[k] !== antes[k]) upd[k] = novo[k];
    Object.assign(upd, camposNovos());
    if (!Object.keys(upd).length) return Promise.resolve();
    return run(sb.from('leads').update(upd).eq('id', id), 'Não foi possível salvar.')
      .then((r) => { Object.assign(lead, novo); return r; });   // gravado: passa a ser a base da próxima comparação
  };
  const acao = (fn) => async () => { await guardar(); await fn(); abrirLead(id); };

  // --- tags
  const novaTag = h('input', { placeholder: 'Nova tag', maxlength: 40, style: 'display:none;width:150px' });
  const btnTag = h('button', { class: 'btn sm ghost', type: 'button', onclick: () => { btnTag.style.display = 'none'; novaTag.style.display = ''; novaTag.focus(); } }, '+ tag');
  novaTag.addEventListener('keydown', async (e) => {
    if (e.key === 'Escape') { e.stopPropagation(); novaTag.value = ''; novaTag.style.display = 'none'; btnTag.style.display = ''; }
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const t = novaTag.value.trim(); if (!t) return;
    await acao(() => run(sb.from('etiquetas').insert({ lead_id: id, texto: t.slice(0, 120) })))();
  });
  const chips = h('div', { class: 'chips' },
    TEMP[lead.temperatura] ? h('span', { class: 'tag ' + TEMP[lead.temperatura][1] }, TEMP[lead.temperatura][0]) : null,
    etiq.map((e) => h('span', { class: 'tag rep' }, e.texto, ' ',
      h('button', { class: 'x', type: 'button', title: 'Remover tag', onclick: acao(() => run(sb.from('etiquetas').delete().eq('id', e.id))) }, '×'))),
    novaTag, btnTag);

  // --- atividades
  const msgs = S.cfg.mensagens || [];
  const linhasAtiv = [];
  for (const f of fus.filter((x) => x.status === 'pendente')) {
    const texto = (msgs[f.numero - 1] || '').replaceAll('{nome}', lead.nome.split(' ')[0]);
    linhasAtiv.push(h('div', { class: 'fu' }, h('div', { class: 'grow' }, h('b', {}, `Follow-up ${f.numero}/4 por WhatsApp`), ' ', h('small', {}, 'para ' + fmtDay(f.data_prevista))),
      lead.telefone ? h('a', { class: 'btn sm', href: waLink(lead.telefone, texto), target: '_blank', rel: 'noopener noreferrer' }, 'WhatsApp') : null,
      h('button', { class: 'btn sm ok', type: 'button', onclick: acao(() => run(sb.from('followups').update({ status: 'feito' }).eq('id', f.id))) }, 'Feito')));
  }
  for (const a of ativ.filter((x) => !x.feito_em)) {
    linhasAtiv.push(h('div', { class: 'fu' }, h('div', { class: 'grow' }, h('span', { class: 'tag' }, TIPO_ATIV[a.tipo]), ' ', a.descricao, ' ',
      h('small', {}, fmtDay(a.vence_em) + (a.hora ? ' ' + a.hora.slice(0, 5) : ''))),
      h('button', { class: 'btn sm ok', type: 'button', onclick: acao(() => run(sb.from('atividades').update({ feito_em: new Date().toISOString() }).eq('id', a.id))) }, 'Feito'),
      h('button', { class: 'btn sm ghost', type: 'button', title: 'Excluir atividade', onclick: acao(() => run(sb.from('atividades').delete().eq('id', a.id))) }, '×')));
  }
  for (const a of ativ.filter((x) => x.feito_em)) {
    linhasAtiv.push(h('div', { class: 'fu feita' }, h('div', { class: 'grow' }, '✓ ', a.descricao, ' ', h('small', {}, 'feita em ' + fmtDT(a.feito_em)))));
  }
  const oQue = h('input', { placeholder: 'Ex.: fazer follow up da proposta', maxlength: 300 });
  const tipoAtiv = h('select', {}, ...Object.entries(TIPO_ATIV).map(([k, v]) => h('option', { value: k }, v)));
  const dataAtiv = h('input', { type: 'date', value: hoje() });
  const horaAtiv = h('input', { type: 'time' });
  const rapido = [['hoje', 0], ['amanhã', 1], ['em 3 dias', 3], ['em 1 semana', 7]].map(([rot, n]) =>
    h('button', { class: 'btn sm ghost', type: 'button', onclick: () => { dataAtiv.value = somaDias(hoje(), n); } }, rot));
  const criarAtiv = acao(async () => {
    if (!oQue.value.trim()) { toast('Escreva o que precisa ser feito.'); throw new Error('vazio'); }
    if (!dataAtiv.value) { toast('Escolha a data.'); throw new Error('vazio'); }
    await run(sb.from('atividades').insert({ lead_id: id, descricao: oQue.value.trim().slice(0, 300), tipo: tipoAtiv.value, vence_em: dataAtiv.value, hora: horaAtiv.value || null }), 'Não foi possível criar a atividade.');
  });

  // --- reunião
  const reun = (lead.reuniao_em ? toLocalInput(lead.reuniao_em) : '').split('T');
  const dataReun = h('input', { type: 'date', value: reun[0] || hoje() });
  const horaReun = h('input', { type: 'time', value: reun[1] || '' });
  const agendar = acao(async () => {
    if (!dataReun.value) { toast('Escolha a data da reunião.'); throw new Error('vazio'); }
    const upd = { reuniao_em: fromLocalInput(dataReun.value + 'T' + (horaReun.value || '09:00')) };
    if (['novo', 'contato', 'conversa'].includes(lead.etapa)) upd.etapa = 'agendada';
    await run(sb.from('leads').update(upd).eq('id', id), 'Não foi possível agendar.');
    celebrar();
  });

  // --- respostas do formulário
  const perfil = envios.length
    ? envios.map((env, i) => h('div', { style: 'margin-top:6px' },
        h('small', { style: 'color:var(--muted)' }, `${i === 0 ? 'Primeiro envio' : 'Preencheu de novo'} • ${fmtDT(env.enviado_em)}`),
        (env.respostas || []).map((qa) => h('div', { class: 'qa' }, h('small', {}, qa.pergunta), h('div', {}, qa.resposta)))))
    : h('div', { class: 'empty' }, 'Sem respostas guardadas (lead criado à mão ou antes desse recurso).');

  const encerrarCard = async (situacao) => { await guardar(); closeDialog(); await encerrar({ ...lead, nome: nome.value, valor_venda: Number(valor.value) || 0 }, situacao); };

  dlg.onclose = () => { if (!dlg.open) recarregar(); };
  openDialog(
    h('div', { class: 'cardhead' },
      h('h2', {}, lead.nome, ' ', h('span', { class: 'tag' }, ROTULO[lead.etapa]), ' ',
        lead.situacao !== 'andamento' ? h('span', { class: 'tag ' + (lead.situacao === 'ganha' ? 'won' : 'lost') }, lead.situacao === 'ganha' ? '🏆 Negociação ganha' : '💔 Negociação perdida') : null),
      h('div', { class: 'actions' },
        lead.telefone
          ? h('a', { class: 'btn wa', href: waLink(lead.telefone), target: '_blank', rel: 'noopener noreferrer', title: 'Abrir a conversa no WhatsApp' }, '💬 WhatsApp')
          : h('button', { class: 'btn ghost', type: 'button', disabled: true, title: 'Este lead não tem telefone' }, '💬 WhatsApp'),
        lead.situacao === 'andamento' ? [
          h('button', { class: 'btn ok', type: 'button', onclick: () => encerrarCard('ganha') }, 'Ganho'),
          h('button', { class: 'btn bad', type: 'button', onclick: () => encerrarCard('perdida') }, 'Perdido'),
        ] : h('button', { class: 'btn', type: 'button', onclick: () => encerrarCard('andamento') }, 'Reabrir negociação'))),
    h('div', { class: 'cardcols' },
      h('div', { class: 'col2' },
        h('div', { class: 'grid2' }, campo('Valor da venda (R$)', valor), campo('Estágio', estagio)),
        h('small', { style: 'color:var(--muted);margin-top:-8px' }, 'O valor só entra no faturamento quando você clica em Ganho.'),
        h('div', { class: 'grid2' }, campo('Temperatura', selTemp), campo('Responsável', h('div', { class: 'linha' },
          (S.equipe || []).find((m) => m.id === lead.responsavel_id) ? avatar((S.equipe || []).find((m) => m.id === lead.responsavel_id), 30) : null, selResp))),
        (S.equipe || []).filter((m) => m.ativo).length === 0 ? h('small', { style: 'color:var(--muted);margin-top:-8px' }, 'Cadastre as pessoas da equipe em Config para escolher o responsável.') : null,
        (lead.situacao === 'perdida' && lead.motivo_perda) ? h('div', {}, h('b', {}, 'Motivo da perda: '), lead.motivo_perda) : null,
        secao('Pessoa',
          campo('Nome', nome),
          campo('Telefone', h('div', { class: 'linha' }, tel, lead.telefone ? h('a', { class: 'btn sm ghost', href: waLink(lead.telefone), target: '_blank', rel: 'noopener noreferrer', title: 'Abrir no WhatsApp' }, 'WhatsApp') : null)),
          campo('E-mail', mail),
          h('label', {}, 'Tags', chips),
          campo('Observação', obs)),
        secao('Anotações', nota,
          h('div', { class: 'actions' }, h('button', { class: 'btn sm ghost', type: 'button', onclick: async () => {
            if (!nota.value.trim()) return;
            await acao(() => run(sb.from('anotacoes').insert({ lead_id: id, tipo: 'nota', texto: nota.value.trim().slice(0, 5000) })))();
          } }, 'Adicionar anotação')),
          h('div', { class: 'tl' }, notas.map((a) => h('div', {}, fmtDT(a.criado_em), ' — ', h('b', {}, a.texto)))))),
      h('div', { class: 'col2' },
        secao('Perfil do formulário',
          lead.temperatura ? h('div', { class: 'chips' }, h('span', { class: 'tag ' + TEMP[lead.temperatura][1] }, TEMP[lead.temperatura][0] + (lead.faturamento ? ' • ' + lead.faturamento : ''))) : null,
          perfil),
        secao('Atividades',
          linhasAtiv.length ? linhasAtiv : h('div', { class: 'empty' }, lead.etapa === 'novo' ? 'Nenhuma atividade. Faça o primeiro contato.' : 'Nenhuma atividade agendada.'),
          campo('O que precisa ser feito', oQue),
          h('div', { class: 'chips' }, rapido),
          h('div', { class: 'grid3' }, campo('Tipo', tipoAtiv), campo('Data', dataAtiv), campo('Hora', horaAtiv)),
          h('div', { class: 'actions' }, h('button', { class: 'btn', type: 'button', onclick: criarAtiv }, 'Criar atividade'))),
        secao('Reunião',
          h('div', { class: 'empty' }, lead.reuniao_em ? 'Marcada para ' + fmtDT(lead.reuniao_em) + (lead.reuniao_realizada_em ? ' • realizada em ' + fmtDT(lead.reuniao_realizada_em) : '') : 'Nenhuma reunião marcada ainda.'),
          h('div', { class: 'grid2' }, campo('Data', dataReun), campo('Hora', horaReun)),
          h('div', { class: 'actions' },
            h('button', { class: 'btn', type: 'button', onclick: agendar }, 'Agendar reunião'),
            lead.etapa === 'agendada' ? h('button', { class: 'btn ok', type: 'button', onclick: acao(() => run(sb.from('leads').update({ etapa: 'realizada' }).eq('id', id), 'Não foi possível atualizar.')) }, 'Marcar como realizada') : null,
            lead.etapa === 'realizada' ? h('button', { class: 'btn ok', type: 'button', onclick: acao(() => run(sb.from('leads').update({ etapa: 'proposta' }).eq('id', id), 'Não foi possível atualizar.')) }, 'Marcar proposta enviada') : null)),
        secao('Datas das etapas', h('div', { class: 'tl', style: 'max-height:none;border:0;padding:0' },
          hist.map((e) => h('div', {}, fmtDT(e.entrou_em), ' — ', h('b', {}, ROTULO[e.etapa]), e.pulada ? ' (passou direto)' : '')))))),
    h('div', { class: 'cardfoot' },
      ehGestor() ? h('button', { class: 'btn bad sm', type: 'button', onclick: async () => {
        if (!confirm('Excluir este lead e todo o histórico? Não dá para desfazer.')) return;
        await run(sb.from('leads').delete().eq('id', id)); closeDialog();
      } }, 'Excluir') : null,
      h('div', { class: 'spacer' }),
      h('button', { class: 'btn ghost', type: 'button', onclick: closeDialog }, 'Cancelar'),
      h('button', { class: 'btn ok', type: 'button', onclick: async () => {
        await guardar();
        if (estagio.value !== lead.etapa) { closeDialog(); await mover({ ...lead, nome: nome.value, valor_venda: Number(valor.value) || 0 }, estagio.value); } else closeDialog();
      } }, 'Salvar')));
  dlg.classList.add('largo');
  dlg.classList.toggle('ganha', lead.situacao === 'ganha');
  dlg.classList.toggle('perdida', lead.situacao === 'perdida');
}

// ---------- hoje ----------
function telaHoje() {
  const t = hoje(), msgs = S.cfg.mensagens || [], porId = Object.fromEntries(S.leads.map((l) => [l.id, l]));
  const q = semAcento(S.q).trim();
  const itens = [

// ---------- metas do mês (funil de verdade) ----------
// O contorno de cada etapa é a META; o verde por dentro é quanto já foi feito NESTE mês.
// Só verde: o tamanho do verde mostra quanto falta.
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs = {}) { const el = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; }
const numBR = (n) => Number(n || 0).toLocaleString('pt-BR');

async function telaMetas() {
  const p = await run(sb.rpc('painel_mes', { p_mes: null }), 'Não foi possível carregar as metas.'); // sempre o mês corrente
  const m = S.cfg.metas || {}, c = p.chegaram;
  const [ano, mes] = p.mes.split('-').map(Number);
  const nomeMes = new Date(ano, mes - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const etapas = [
    { nome: 'Leads', atual: c.novo, meta: Number(m.leads) || 0 },
    { nome: 'Leads quentes', atual: c.quente, meta: Number(m.quentes) || 0 },
    { nome: 'Reuniões agendadas', atual: c.agendada, meta: Number(m.agendadas) || 0 },
    { nome: 'Reuniões realizadas', atual: c.realizada, meta: Number(m.realizadas) || 0 },
    { nome: 'Vendas', atual: c.fechado, meta: Number(m.vendas) || 0 },
  ];
  const fat = Number(m.faturamento) || 0, rec = Number(p.receita) || 0;
  const semMetas = etapas.every((e) => !e.meta) && !fat;
  const pctDe = (atual, meta) => meta > 0 ? Math.round(atual / meta * 100) : null;
  const razao = (atual, meta) => meta > 0 ? Math.min(1, atual / meta) : 0;

  // Funil à esquerda: contorno = meta; verde por dentro = quanto já foi feito (o tamanho mostra o quanto falta)
  // uma cor por etapa: forte (o que foi feito), suave (fundo do contorno) e linha (contorno)
  const PALETA = [
    { forte: '#2f5bea', suave: '#e8eeff', linha: '#b9c9fb' }, // Leads: azul
    { forte: '#7c3aed', suave: '#f0e8ff', linha: '#d4bcfb' }, // Leads quentes: violeta
    { forte: '#0891b2', suave: '#dff4f9', linha: '#a8dbe8' }, // Reuniões agendadas: ciano
    { forte: '#0d9488', suave: '#dcf5f1', linha: '#a6e0d8' }, // Reuniões realizadas: verde-água
    { forte: '#16a34a', suave: '#e3f6ea', linha: '#b3e3c5' }, // Vendas: verde
  ];
  const SEG = 72, H = SEG * etapas.length, topo = [100, 80, 60, 42, 28], ponta = 16;
  const poly = (wt, wb, f, y0, y1) => `${50 - wt * f / 2},${y0} ${50 + wt * f / 2},${y0} ${50 + wb * f / 2},${y1} ${50 - wb * f / 2},${y1}`;
  const svg = sv('svg', { viewBox: `0 0 100 ${H}`, preserveAspectRatio: 'none', 'aria-hidden': 'true', class: 'm-funil' });
  etapas.forEach((e, i) => {
    const cor = PALETA[i], wt = topo[i], wb = i + 1 < topo.length ? topo[i + 1] : ponta, y0 = i * SEG + 3, y1 = (i + 1) * SEG - 3, r = razao(e.atual, e.meta);
    svg.append(sv('polygon', { points: poly(wt, wb, 1, y0, y1), class: 'f-fora' + (e.meta > 0 ? '' : ' aberta'), style: `fill:${cor.suave};stroke:${cor.linha}`, 'vector-effect': 'non-scaling-stroke' }));
    if (r > 0) svg.append(sv('polygon', { points: poly(wt, wb, r * 0.9, y0 + 4, y1 - 4), class: 'f-dentro', style: `fill:${cor.forte}` }));
  });

  // Barras à direita: uma por etapa, alinhadas com o funil
  const linhas = etapas.map((e, i) => {
    const pc = pctDe(e.atual, e.meta), r = razao(e.atual, e.meta);
    return h('div', { class: 'm-linha', style: `--c:${PALETA[i].forte};--c-line:${PALETA[i].linha}` },
      h('div', { class: 'm-topo' }, h('b', {}, e.nome),
        h('span', { class: 'm-valor' }, h('em', {}, numBR(e.atual)), e.meta > 0 ? h('small', {}, ' / ' + numBR(e.meta)) : h('small', {}, ' • meta em aberto'))),
      h('div', { class: 'm-trilho' + (e.meta > 0 ? '' : ' aberta') }, h('i', { style: `width:${r * 100}%` })),
      h('div', { class: 'm-pct' }, pc === null ? '—' : pc + '%' + (pc >= 100 ? ' ✓' : '')));
  });

  const rf = razao(rec, fat), pf = pctDe(rec, fat);
  const barra = h('div', { class: 'm-fat', style: '--c:#16a34a;--c-line:#b3e3c5' },
    h('div', { class: 'm-fat-topo' }, h('span', { class: 'm-fat-rot' }, 'Faturamento de ' + nomeMes),
      h('span', { class: 'm-valor grande' }, h('em', {}, brl(rec)), fat > 0 ? h('small', {}, ' / ' + brl(fat)) : h('small', {}, ' • meta em aberto'))),
    h('div', { class: 'm-trilho grosso' + (fat > 0 ? '' : ' aberta') }, h('i', { style: `width:${rf * 100}%` })),
    h('div', { class: 'm-pct' }, pf === null ? '—' : pf + '%' + (pf >= 100 ? ' ✓' : '')),
    h('small', { style: 'color:var(--muted)' }, 'Soma só o valor das negociações que você marcou como Ganho neste mês.'));

  return [
    semMetas ? h('div', { class: 'panel', style: 'border-color:#bfe3cd;background:#f0faf4' }, 'Você ainda não definiu as metas. ',
      h('button', { class: 'btn sm', onclick: () => { S.view = 'config'; desenhar(); } }, 'Definir metas'),
      ' Enquanto isso, o funil mostra o que você já fez no mês.') : null,
    h('div', { class: 'm-card' },
      h('div', { class: 'm-cab' }, h('span', { class: 'm-pill' }, 'Funil do mês'), h('span', { class: 'm-mes' }, nomeMes)),
      h('p', { class: 'm-desc' }, 'Sempre o mês atual. O contorno de cada etapa é a meta; a área verde mostra quanto já foi atingido. Lead que virou quente conta no mês, mesmo que já tenha avançado de etapa.'),
      h('div', { class: 'm-corpo' }, svg, h('div', { class: 'm-linhas' }, ...linhas)),
      barra),
  ].filter(Boolean);
}

const AV = { itens: [], lidos: new Set(), aba: null, aberto: false, ultima: 0 };
const chaveLocal = () => 'crm_lidos_' + (S.eu?.id ?? 'x');
const diaBR = (iso) => new Date(iso).toLocaleDateString('en-CA', { timeZone: TZ });
const horaBR = (iso) => new Date(iso).toLocaleTimeString('pt-BR', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });

function haQuanto(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'agora'; if (m < 60) return 'há ' + m + ' min';
  const hh = Math.round(m / 60); if (hh < 24) return 'há ' + hh + ' h';
  const d = Math.round(hh / 24); return 'há ' + d + (d === 1 ? ' dia' : ' dias');
}
const listaGeral = () => AV.itens.filter((i) => !i.soMinha);

async function atualizarAvisos(forcar = false) {
  if (!S.eu) return;
  if (!forcar && Date.now() - AV.ultima < 20000) return;   // não consulta o banco toda hora
  AV.ultima = Date.now();
  const meu = S.eu.id, hojeStr = hoje(), porId = new Map(S.leads.map((l) => [l.id, l]));
  const lidosReg = await sb.from('avisos_lidos').select('chave');
  if (!lidosReg.error) AV.lidos = new Set((lidosReg.data || []).map((x) => x.chave));
  else { try { AV.lidos = new Set(JSON.parse(localStorage.getItem(chaveLocal()) || '[]')); } catch { /* ok */ } }

  // O sino mostra só tarefas agendadas: reuniões de hoje e follow-ups que vencem hoje (ou estão atrasados).
  const itens = [], de = (l) => ({ lead: l.id, resp: l.responsavel_id, minha: l.responsavel_id === meu });
  for (const l of S.leads) if (l.reuniao_em && l.situacao === 'andamento' && diaBR(l.reuniao_em) === hojeStr)
    itens.push({ chave: 'reuniao:' + l.id + ':' + hojeStr, quando: l.reuniao_em, tipo: 'reuniao', icone: '📅', texto: 'Reunião hoje às ' + horaBR(l.reuniao_em) + ' — ' + l.nome, ...de(l) });
  for (const f of (S.fups || [])) {
    const l = porId.get(f.lead_id); if (!l || l.situacao !== 'andamento' || String(f.data_prevista).slice(0, 10) > hojeStr) continue;
    const atrasado = String(f.data_prevista).slice(0, 10) < hojeStr;
    itens.push({ chave: 'fu:' + f.id, quando: f.data_prevista, tipo: 'reuniao', icone: '💬', texto: 'Follow-up ' + (f.numero ?? '') + (atrasado ? ' atrasado' : ' de hoje') + ' — ' + l.nome, ...de(l) });
  }
  itens.sort((x, y) => new Date(x.quando) - new Date(y.quando));
  AV.itens = itens.slice(0, 80);
  atualizarBadgeSino(); if (AV.aberto) renderSino();
}

// Avatar: a foto da pessoa, ou um círculo com a inicial do nome
function avatar(pessoa, px = 28) {
  const inicial = ((pessoa?.nome || '?').trim()[0] || '?').toUpperCase();
  return pessoa?.foto
    ? h('img', { class: 'av', src: pessoa.foto, alt: pessoa.nome || '', style: `width:${px}px;height:${px}px` })
    : h('span', { class: 'av av-ini', 'aria-hidden': 'true', style: `width:${px}px;height:${px}px;font-size:${Math.round(px * .46)}px` }, inicial);
}
// Lê a imagem, recorta em quadrado e reduz (256 px, JPEG): a foto fica com poucos KB
function redimensionarFoto(arquivo) {
  return new Promise((ok, falha) => {
    if (!arquivo || !/^image\/(jpeg|png|webp)$/.test(arquivo.type)) return falha(new Error('Escolha uma imagem JPG, PNG ou WebP.'));
    if (arquivo.size > 8 * 1024 * 1024) return falha(new Error('A imagem é grande demais (máximo 8 MB).'));
    const leitor = new FileReader();
    leitor.onerror = () => falha(new Error('Não foi possível ler a imagem.'));
    leitor.onload = () => {
      const img = new Image();
      img.onerror = () => falha(new Error('Esse arquivo não parece ser uma imagem válida.'));
      img.onload = () => {
        const lado = Math.min(img.naturalWidth, img.naturalHeight);
        for (const [tam, qual] of [[256, 0.85], [256, 0.7], [192, 0.7], [128, 0.7]]) {
          const c = document.createElement('canvas'); c.width = c.height = tam;
          const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, tam, tam);   // fundo branco para PNG transparente
          x.drawImage(img, (img.naturalWidth - lado) / 2, (img.naturalHeight - lado) / 2, lado, lado, 0, 0, tam, tam);
          const url = c.toDataURL('image/jpeg', qual);
          if (url.length <= 60000) return ok(url);
        }
        falha(new Error('Não foi possível reduzir a imagem. Tente outra foto.'));
      };
      img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  });
}

// ---------- equipe: convites (a função gerenciar-equipe, no Supabase, cria o login) ----------
async function chamarEquipe(corpo) {
  try {
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(SUPABASE_URL + '/functions/v1/gerenciar-equipe', {
      method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: 'Bearer ' + (session?.access_token || '') },
      body: JSON.stringify(corpo),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.erro || 'Erro ' + r.status);
    return j;
  } catch (e) {
    if (/failed to fetch|networkerror|load failed/i.test(e.message)) {
      toast(location.protocol === 'file:'
        ? 'Os convites só funcionam pelo endereço publicado do CRM (o do GitHub Pages). Você abriu o arquivo direto do computador: abra o endereço publicado e tente de novo.'
        : 'Não foi possível falar com o servidor de convites. Confira sua internet e se a função "gerenciar-equipe" está publicada no Supabase.');
    } else toast(e.message);
    throw e;
  }
}

    return h('div', { class: 'fu' },
      avatar(m, 36),
      h('div', { class: 'grow' }, h('b', {}, m.nome), ' ', m.email ? h('small', {}, m.email) : h('small', {}, '(sem e-mail)'), ' ',
        h('span', { class: 'tag' + cls }, txt), m.ativo ? null : h('span', { class: 'tag' }, 'inativo')),
      papelSel,
      h('button', { class: 'btn sm ghost', type: 'button', title: 'Trocar a foto de ' + m.nome, onclick: () => dialogoFoto(m, async (foto) => {
        const { error } = await sb.from('equipe').update({ foto }).eq('id', m.id);
        if (error) throw error;
        if (S.eu && m.id === S.eu.id) { S.eu.foto = foto; atualizarChip(); }
        await carregar(); desenhar();
      }) }, '📷 Foto'),
      m.auth_user_id
        ? h('button', { class: 'btn sm ghost', type: 'button', onclick: novoLinkDe(m) }, 'Gerar novo link')
        : h('button', { class: 'btn sm', type: 'button', onclick: convidarMembro(m) }, 'Convidar'),
      h('button', { class: 'btn sm ghost', type: 'button', onclick: acaoEquipe(() => run(sb.from('equipe').update({ ativo: !m.ativo }).eq('id', m.id), 'Não foi possível atualizar.')) }, m.ativo ? 'Desativar' : 'Ativar'),
      h('button', { class: 'btn sm bad', type: 'button', onclick: remover(m) }, 'Remover'));
  });
  const convidar = acaoEquipe(async () => {
    const nome = novoNome.value.trim(), email = novoMail.value.trim(), papelId = novoPapel.value;
    if (!nome) { toast('Escreva o nome da pessoa.'); throw new Error('vazio'); }
    if (!email) { toast('O e-mail é obrigatório para criar o convite.'); throw new Error('vazio'); }
    const r = await chamarEquipe({ acao: 'convidar', nome, email, papel: papelId, enviar_email: enviarEmail.checked });
    return () => dialogoConvite(nome, papelId, r);
  });

  return [
    h('div', { class: 'panel' }, h('h2', {}, 'Metas do mês'),
      h('p', { class: 'empty' }, 'Preencha o que quiser. O que ficar em branco aparece como "meta em aberto" na tela Metas. Valem para o mês corrente e para os próximos, até você mudar.'),
      h('div', { class: 'grid3' }, ...metas.map((x) => x.label))),
    h('div', { class: 'panel' }, h('h2', {}, 'Equipe e acessos'),
      location.protocol === 'file:' ? h('div', { class: 'aviso-convite' }, '⚠️ Você abriu o CRM direto do computador. Os convites só funcionam com o CRM publicado (GitHub Pages): o link do convite precisa voltar para o endereço público do CRM.') : null,
      h('p', { class: 'empty' }, 'Cada pessoa recebe um convite e cria o próprio login e senha. ',
        h('b', {}, 'Gestor'), ': tudo (equipe, configurações, metas, excluir). ', h('b', {}, 'Gerente'), ': vê e edita todos os leads, vê Painel e Metas. ',
        h('b', {}, 'Vendedor'), ': só os leads em que é o responsável. Sempre existe pelo menos um gestor.'),
      linhas.length ? linhas : h('div', { class: 'empty' }, 'Nenhuma pessoa cadastrada ainda.'),
      h('h3', { style: 'margin:16px 0 6px;font-size:14px' }, 'Convidar uma pessoa'),
      h('div', { class: 'grid3', style: 'align-items:end' }, h('label', {}, 'Nome', novoNome), h('label', {}, 'E-mail', novoMail), h('label', {}, 'Papel', novoPapel)),
      h('label', { style: 'flex-direction:row;align-items:center;gap:8px;margin-top:8px', for: 'enviarEmail' }, enviarEmail, 'Tentar enviar também por e-mail (precisa de e-mail configurado no Supabase; o link para o WhatsApp funciona sempre)'),
      h('div', { class: 'actions', style: 'margin-top:10px' }, h('button', { class: 'btn', type: 'button', onclick: convidar }, '✉️ Criar convite')),
      h('label', { style: 'margin-top:14px;max-width:340px' }, 'Responsável padrão dos leads novos', padrao)),
    painelChecklistConfig(),
    h('div', { class: 'panel' }, h('h2', {}, 'Mensagens de follow-up (WhatsApp)'),
      h('p', { class: 'empty' }, 'Use {nome} para o primeiro nome do lead. Dias: 1º = 1 dia após a reunião, 2º = +3, 3º = +1, 4º = +2.'), tpl),
    h('div', { class: 'actions' },
      h('button', { class: 'btn', onclick: () => salvar(true) }, 'Salvar configurações'),
      h('button', { class: 'btn ghost', onclick: exportarCsv }, 'Exportar leads (CSV)')),
    h('p', { class: 'empty' }, 'Dica: exporte o CSV toda semana. O plano gratuito do Supabase não faz backup automático.'),
  ];
}
function exportarCsv() {
  const cel = (v) => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replaceAll('"', '""') + '"'; }; // evita fórmulas maliciosas no Excel
  const cols = ['nome', 'email', 'telefone', 'etapa', 'origem', 'situacao', 'temperatura', 'responsavel', 'valor_venda', 'motivo_perda', 'reuniao_em', 'reuniao_realizada_em', 'fechado_em', 'criado_em'];
  const csv = '﻿' + [cols.join(',')].concat(S.leads.map((l) => cols.map((c) => cel(c === 'responsavel' ? ((S.equipe || []).find((m) => m.id === l.responsavel_id)?.nome ?? '') : l[c])).join(','))).join('\r\n');
  const a = h('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), download: `leads-${hoje()}.csv` });
  document.body.append(a); a.click(); a.remove();
}

// ---------- início ----------
sb.auth.onAuthStateChange((evento, sessao) => {
  if (evento === 'SIGNED_OUT' || !sessao) { criandoSenha = false; S.leads = []; S.cfg = {}; S.proximo = {}; S.eu = null; AV.itens = []; fecharSino(); closeDialog(); telaLogin(); return; }
  if (criandoSenha) { telaCriarSenha(); return; }  // chegou por um convite: primeiro cria a senha
  if (evento === 'SIGNED_IN' || evento === 'INITIAL_SESSION') abrirApp();
});
</script>
